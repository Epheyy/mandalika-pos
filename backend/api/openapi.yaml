openapi: 3.1.0
info:
  title: Mandalika POS API
  version: 0.2.0
  description: >
    Backend for Mandalika POS. Single contract — Go DTOs (oapi-codegen) and the
    TypeScript client (openapi-typescript) are generated from this file; CI fails
    on drift. Phase B exposes auth + read endpoints (outlet-scoped) + reports
    aggregation + users CRUD. Writes/order-tx/sync land in Phase C.
servers:
  - url: http://localhost:8080
security:
  - bearerAuth: []
tags:
  - name: auth
  - name: catalog
  - name: customers
  - name: promotions
  - name: imports
  - name: sales
  - name: settings
  - name: users
  - name: reports

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    schedulerSecret:
      type: apiKey
      in: header
      name: X-Scheduler-Secret
      description: ERP_SCHEDULER_TOKEN shared secret for Cloud Scheduler (internal ERP routes only).
  parameters:
    WIBDateFrom:
      name: dateFrom
      in: query
      required: false
      description: Inclusive lower bound, a YYYY-MM-DD business day (the day in the outlet's timezone; a shift's sales take the shift's opening date). 400 when unparseable.
      schema: { type: string, format: date }
    WIBDateTo:
      name: dateTo
      in: query
      required: false
      description: Inclusive upper bound, a YYYY-MM-DD business day (the day in the outlet's timezone; a shift's sales take the shift's opening date). 400 when unparseable.
      schema: { type: string, format: date }
    OrderStatusFilter:
      name: status
      in: query
      required: false
      schema: { type: string, enum: [completed, refunded, cancelled] }
    OrderDateBasis:
      name: dateBasis
      in: query
      required: false
      description: |
        `sale` (default) bounds dateFrom/dateTo on the sale business day. `refund` bounds them on the
        refund business day, returns only refunded rows and orders them by refundedAt (newest first).
        Legacy from/to are unaffected. 400 for any other value.
      schema: { type: string, enum: [sale, refund], default: sale }
    OrderPaymentMethodFilter:
      name: paymentMethod
      in: query
      required: false
      description: Matched case-insensitively after trimming whitespace.
      schema: { type: string }
    OrderSearch:
      name: q
      in: query
      required: false
      description: Substring match on order number, cashier name, customer name, or linked customer phone/name.
      schema: { type: string }
    OutletHeader:
      name: X-Outlet-Id
      in: header
      required: false
      description: Active outlet override (admin only, or must match token outlet).
      schema: { type: string, format: uuid }
    ImportIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Required when dryRun=false (generated once per preview, reused on retry).
      schema: { type: string }
    WriteIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: >
        Optional. One uuid per form submit, reused on retry; the same key with the
        same body replays the stored response, with a different body returns 409.
      schema: { type: string, maxLength: 200 }
    RequiredWriteIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >
        One uuid per form submit, reused on retry; the same key with the same body replays the
        stored response, with a different body returns 409. Required because a double-submit
        would create or apply a second document.
      schema: { type: string, minLength: 1, maxLength: 200 }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    OutletQuery:
      name: outletId
      in: query
      description: Admin-only explicit outlet scope; "all" for cross-outlet.
      schema: { type: string }
  schemas:
    # --- ERP outbox (plan step 5) ---
    ErpRelayReport:
      type: object
      required: [disabled, claimed, delivered, replayed, held, retried, dead, released]
      properties:
        disabled: { type: boolean }
        reason: { type: string }
        claimed: { type: integer }
        delivered: { type: integer }
        replayed: { type: integer }
        held: { type: integer }
        retried: { type: integer }
        dead: { type: integer }
        released: { type: integer }
        stopped: { type: string, enum: [unauthorized, forbidden, rate_limited, budget] }
    ErpRelayReportResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/ErpRelayReport' }
    ErpOutboxItem:
      type: object
      required: [id, documentId, kind, locationType, locationId, refType, refId, part, partCount, status, attempts, nextAttemptAt, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        documentId: { type: string, format: uuid }
        kind: { type: string, enum: [sale, refund, transfer_out, transfer_in, transfer_cancel, receipt, adjust, count, opening, write_off] }
        locationType: { type: string, enum: [outlet, warehouse] }
        locationId: { type: string, format: uuid }
        refType: { type: string }
        refId: { type: string, format: uuid }
        refNumber: { type: string, nullable: true }
        part: { type: integer }
        partCount: { type: integer }
        status: { type: string, enum: [pending, held, sending, delivered, replayed, dead] }
        attempts: { type: integer }
        nextAttemptAt: { type: string, format: date-time }
        lastHttpStatus: { type: integer, nullable: true }
        lastError: { type: string, nullable: true }
        holdReason: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        deliveredAt: { type: string, format: date-time, nullable: true }
    ErpOutboxDetail:
      allOf:
        - { $ref: '#/components/schemas/ErpOutboxItem' }
        - type: object
          properties:
            payload: { type: object, additionalProperties: true, nullable: true }
            payloadSha256: { type: string, nullable: true }
            erpResponse: { type: object, additionalProperties: true, nullable: true }
    ErpOutboxCounts:
      type: object
      required: [pending, held, sending, delivered, replayed, dead]
      properties:
        pending: { type: integer }
        held: { type: integer }
        sending: { type: integer }
        delivered: { type: integer }
        replayed: { type: integer }
        dead: { type: integer }
    ErpOutboxItemResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/ErpOutboxItem' }
    ErpOutboxDetailResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/ErpOutboxDetail' }
    ErpOutboxListResponse:
      type: object
      required: [data, meta, counts]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/ErpOutboxItem' } }
        meta: { $ref: '#/components/schemas/Meta' }
        counts: { $ref: '#/components/schemas/ErpOutboxCounts' }
    # --- end ERP outbox ---
    ErpCatalogPullResource:
      type: object
      required: [resource, mode, runId, status, pages, upserted, tombstoned, deactivated, itemErrors, error, watermark]
      properties:
        resource: { type: string, enum: [outlets, finished_goods] }
        mode: { type: string, enum: [full, incremental, auto], description: "the mode the run used; the requested mode when it stopped before resolving it" }
        runId: { type: string }
        status: { type: string, enum: [completed, partial, failed] }
        pages: { type: integer }
        upserted: { type: integer }
        tombstoned: { type: integer }
        deactivated: { type: integer }
        itemErrors: { type: integer }
        error: { type: string }
        watermark: { type: string, format: date-time, nullable: true }
    ErpCatalogPullReport:
      type: object
      required: [status, resources]
      properties:
        status: { type: string, enum: [completed, partial, failed, skipped_locked] }
        resources:
          type: array
          items: { $ref: '#/components/schemas/ErpCatalogPullResource' }
    ErpCatalogPullResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/ErpCatalogPullReport' }
    ErpSyncRun:
      type: object
      required: [id, resource, mode, startedAt, finishedAt, pages, upserted, tombstoned, status, error]
      properties:
        id: { type: string }
        resource: { type: string }
        mode: { type: string, enum: [full, incremental] }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time, nullable: true }
        pages: { type: integer, nullable: true }
        upserted: { type: integer, nullable: true }
        tombstoned: { type: integer, nullable: true }
        status: { type: string, enum: [running, completed, partial, failed] }
        error: { type: string, nullable: true }
    ErpWatermark:
      type: object
      required: [resource, watermark, lastFullSyncAt, lastRunAt, lastStatus, lastError]
      properties:
        resource: { type: string }
        watermark: { type: string, format: date-time, nullable: true }
        lastFullSyncAt: { type: string, format: date-time, nullable: true }
        lastRunAt: { type: string, format: date-time, nullable: true }
        lastStatus: { type: string, nullable: true }
        lastError: { type: string, nullable: true }
    ErpSyncRunsReport:
      type: object
      required: [runs, watermarks]
      properties:
        runs: { type: array, items: { $ref: '#/components/schemas/ErpSyncRun' } }
        watermarks: { type: array, items: { $ref: '#/components/schemas/ErpWatermark' } }
    ErpSyncRunsResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/ErpSyncRunsReport' }
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
    Meta:
      type: object
      required: [total, page, limit]
      properties:
        total: { type: integer }
        page: { type: integer }
        limit: { type: integer }
    User:
      type: object
      required: [id, email, displayName, role, permissions, createdAt]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        displayName: { type: string }
        role: { type: string, enum: [admin, manager, cashier] }
        outletId: { type: string, format: uuid, nullable: true }
        photoURL: { type: string, nullable: true }
        permissions:
          type: array
          items: { type: string }
        createdAt: { type: string, format: date-time }
    AuthData:
      type: object
      required: [access, refresh, user]
      properties:
        access: { type: string }
        refresh: { type: string }
        user: { $ref: '#/components/schemas/User' }
    AuthResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/AuthData' }
    UserResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/User' }
    UserListResponse:
      type: object
      required: [data]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/User' } }
        meta: { $ref: '#/components/schemas/Meta' }
    CreateUserRequest:
      type: object
      required: [email, password, displayName, role]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password, minLength: 8 }
        displayName: { type: string }
        role: { type: string, enum: [admin, manager, cashier] }
        outletId: { type: string, format: uuid, nullable: true }
        permissions: { type: array, items: { type: string } }
    UpdateUserRequest:
      type: object
      properties:
        displayName: { type: string }
        role: { type: string, enum: [admin, manager, cashier] }
        outletId: { type: string, format: uuid, nullable: true }
        photoURL: { type: string, nullable: true }
        permissions: { type: array, items: { type: string } }
    Outlet:
      type: object
      required: [id, name, isActive, timezone, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        code: { type: string, nullable: true }
        address: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        logoUrl: { type: string, nullable: true }
        isActive: { type: boolean }
        timezone:
          type: string
          enum: [Asia/Jakarta, Asia/Makassar, Asia/Jayapura]
          description: Outlet timezone (WIB, WITA, WIT). Decides the business day of its sales.
        createdAt: { type: string, format: date-time }
        erpSlug: { type: string, nullable: true, readOnly: true }  # ERP catalog (step 4)
        erpCode: { type: string, nullable: true, readOnly: true }  # ERP catalog (step 4)
    OutletListResponse:
      type: object
      required: [data]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Outlet' } }
    Warehouse:
      type: object
      required: [id, name, isActive, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        code: { type: string, nullable: true }
        address: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        logoUrl: { type: string, nullable: true }
        isActive: { type: boolean }
        createdAt: { type: string, format: date-time }
    WarehouseInput:
      type: object
      required: [name, isActive]
      properties:
        name: { type: string }
        code: { type: string, nullable: true }
        address: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        logoUrl: { type: string, nullable: true }
        isActive: { type: boolean }
    WarehouseListResponse:
      type: object
      required: [data]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Warehouse' } }
    WarehouseStockRow:
      type: object
      required: [productId, productName, variantSize, stock]
      properties:
        productId: { type: string, format: uuid }
        productName: { type: string }
        variantSize: { type: string }
        sku: { type: string }
        stock: { type: integer }
        parLevel: { type: integer, nullable: true }
    WarehouseStockResponse:
      type: object
      required: [data]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/WarehouseStockRow' } }
    GoodsReceiptItemInput:
      type: object
      required: [productId, variantSize, qty]
      properties:
        productId: { type: string, format: uuid }
        variantSize: { type: string }
        qty: { type: integer }
        unitCost: { type: number, format: double, nullable: true }
    GoodsReceiptInput:
      type: object
      required: [items]
      properties:
        supplier: { type: string, nullable: true }
        note: { type: string, nullable: true }
        items: { type: array, items: { $ref: '#/components/schemas/GoodsReceiptItemInput' } }
    WarehouseAdjustInput:
      type: object
      required: [productId, variantSize, newQty, reason]
      properties:
        productId: { type: string, format: uuid }
        variantSize: { type: string }
        newQty: { type: integer }
        reason: { type: string }
    Ingredient:
      type: object
      required: [id, name, unit, sku, isActive, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        unit: { type: string }
        sku: { type: string }
        categoryId: { type: string, format: uuid, nullable: true }
        categoryName: { type: string, nullable: true }
        defaultUnitCost: { type: number, format: double, nullable: true }
        notes: { type: string, nullable: true }
        isActive: { type: boolean }
        createdAt: { type: string, format: date-time }
    IngredientInput:
      type: object
      required: [name, unit, isActive]
      properties:
        name: { type: string }
        unit: { type: string }
        sku: { type: string, nullable: true }
        categoryId: { type: string, format: uuid, nullable: true }
        defaultUnitCost: { type: number, format: double, nullable: true }
        notes: { type: string, nullable: true }
        isActive: { type: boolean }
    IngredientListResponse:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Ingredient' } }
        meta: { $ref: '#/components/schemas/Meta' }
    IngredientStockRow:
      type: object
      required: [ingredientId, name, unit, qty]
      properties:
        ingredientId: { type: string, format: uuid }
        name: { type: string }
        unit: { type: string }
        defaultUnitCost: { type: number, format: double, nullable: true }
        qty: { type: number }
    IngredientStockResponse:
      type: object
      required: [data]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/IngredientStockRow' } }
    RecipeIngredientLine:
      type: object
      required: [ingredientId, nameAtSave, name, qty, unitAtSave, isActive, onHandTotal]
      properties:
        ingredientId: { type: string, format: uuid }
        nameAtSave: { type: string }
        name: { type: string }
        qty: { type: number }
        unitAtSave: { type: string }
        costAtSave: { type: number, format: double, nullable: true }
        defaultUnitCost: { type: number, format: double, nullable: true }
        isActive: { type: boolean }
        onHandTotal: { type: number }
    Recipe:
      type: object
      required: [variantId, versionNo, versionCount, items]
      properties:
        variantId: { type: string, format: uuid }
        recipeId: { type: string, format: uuid, nullable: true }
        currentVersionId: { type: string, format: uuid, nullable: true }
        versionId: { type: string, format: uuid, nullable: true }
        versionNo: { type: integer }
        notes: { type: string, nullable: true }
        totalCostCached: { type: number, format: double, nullable: true }
        versionCount: { type: integer }
        items: { type: array, items: { $ref: '#/components/schemas/RecipeIngredientLine' } }
    RecipeResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/Recipe' }
    RecipeVersionSummary:
      type: object
      required: [id, versionNo, createdAt]
      properties:
        id: { type: string, format: uuid }
        versionNo: { type: integer }
        notes: { type: string, nullable: true }
        totalCostCached: { type: number, format: double, nullable: true }
        createdAt: { type: string, format: date-time }
        createdByName: { type: string, nullable: true }
    RecipeVersionListResponse:
      type: object
      required: [data]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/RecipeVersionSummary' } }
    RecipeVariantIdsResponse:
      type: object
      required: [variantIds]
      properties:
        variantIds:
          type: array
          items: { type: string }
    RecipeSaveItem:
      type: object
      required: [ingredientId, qty, sortOrder]
      properties:
        ingredientId: { type: string, format: uuid }
        qty: { type: number }
        sortOrder: { type: integer }
    RecipeSaveInput:
      type: object
      required: [items]
      properties:
        expectedCurrentVersionId: { type: string, format: uuid, nullable: true }
        notes: { type: string, nullable: true }
        items: { type: array, items: { $ref: '#/components/schemas/RecipeSaveItem' } }
    RecipeRestoreInput:
      type: object
      properties:
        expectedCurrentVersionId: { type: string, format: uuid, nullable: true }
    IngredientCategory:
      type: object
      required: [id, name, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        sortOrder: { type: integer, nullable: true }
        createdAt: { type: string, format: date-time }
    IngredientCategoryInput:
      type: object
      required: [name]
      properties:
        name: { type: string }
        sortOrder: { type: integer, nullable: true }
    IngredientCategoryListResponse:
      type: object
      required: [data]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/IngredientCategory' } }
    Tag:
      type: object
      required: [id, name, color, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        color: { type: string }
        sortOrder: { type: integer, nullable: true }
        createdAt: { type: string, format: date-time }
    TagInput:
      type: object
      required: [name, color]
      properties:
        name: { type: string }
        color: { type: string }
        sortOrder: { type: integer, nullable: true }
    TagListResponse:
      type: object
      required: [data]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Tag' } }
    SetCustomerTagsInput:
      type: object
      required: [tagIds]
      properties:
        tagIds: { type: array, items: { type: string } }
    Segment:
      type: object
      required: [id, name, color, sortOrder, isActive, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        color: { type: string }
        sortOrder: { type: integer }
        rMin: { type: integer, nullable: true }
        rMax: { type: integer, nullable: true }
        fMin: { type: integer, nullable: true }
        fMax: { type: integer, nullable: true }
        mMin: { type: number, format: double, nullable: true }
        mMax: { type: number, format: double, nullable: true }
        isActive: { type: boolean }
        createdAt: { type: string, format: date-time }
    SegmentInput:
      type: object
      required: [name, color]
      properties:
        name: { type: string }
        color: { type: string }
        rMin: { type: integer, nullable: true }
        rMax: { type: integer, nullable: true }
        fMin: { type: integer, nullable: true }
        fMax: { type: integer, nullable: true }
        mMin: { type: number, format: double, nullable: true }
        mMax: { type: number, format: double, nullable: true }
        isActive: { type: boolean, nullable: true }
    SegmentListResponse:
      type: object
      required: [data]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Segment' } }
    ReorderSegmentsInput:
      type: object
      required: [orderedIds]
      properties:
        orderedIds: { type: array, items: { type: string } }
    CustomerSegment:
      type: object
      required: [id, name, color]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        color: { type: string }
    IngredientUsageVariant:
      type: object
      required: [productName, variantSize]
      properties:
        productName: { type: string }
        variantSize: { type: string }
    IngredientUsageResponse:
      type: object
      required: [variants]
      properties:
        variants:
          type: array
          items: { $ref: '#/components/schemas/IngredientUsageVariant' }
    IngredientGoodsReceiptItemInput:
      type: object
      required: [ingredientId, qty]
      properties:
        ingredientId: { type: string, format: uuid }
        qty: { type: number }
        unitCost: { type: number, format: double, nullable: true }
    IngredientGoodsReceiptInput:
      type: object
      required: [items]
      properties:
        supplier: { type: string, nullable: true }
        note: { type: string, nullable: true }
        items: { type: array, items: { $ref: '#/components/schemas/IngredientGoodsReceiptItemInput' } }
    IngredientAdjustInput:
      type: object
      required: [ingredientId, newQty, reason]
      properties:
        ingredientId: { type: string, format: uuid }
        newQty: { type: number }
        reason: { type: string }
    IngredientTransferItem:
      type: object
      required: [id, ingredientId, ingredientName, ingredientUnit, sentQty]
      properties:
        id: { type: string, format: uuid }
        ingredientId: { type: string, format: uuid }
        ingredientName: { type: string }
        ingredientUnit: { type: string }
        sentQty: { type: number }
        receivedQty: { type: number, nullable: true }
        difference: { type: number, nullable: true }
    IngredientTransfer:
      type: object
      required: [id, transferNo, status, source, dest, createdAt, items]
      properties:
        id: { type: string, format: uuid }
        transferNo: { type: string }
        status: { type: string, enum: [draft, in_transit, completed, cancelled] }
        source: { $ref: '#/components/schemas/TransferLocation' }
        dest: { $ref: '#/components/schemas/TransferLocation' }
        suratJalanNo: { type: string, nullable: true }
