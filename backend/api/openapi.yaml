        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: stock counts
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StockCountListResponse' }
    post:
      operationId: createStockCount
      tags: [sales]
      summary: Create stock count (outlet-scoped; freezes current stock)
      parameters:
        - $ref: '#/components/parameters/OutletHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StockCountCreateInput' }
      responses:
        '201':
          description: created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IdResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/stock-counts/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      operationId: updateStockCount
      tags: [sales]
      summary: >
        Update stock count (outlet-scoped). Start re-freezes frozen quantities from
        live stock; in progress, items only update actualQty of existing lines and
        capture the live stock as that line's baseline; planned counts replace the
        line list. Repeating start or cancel is a no-op.
      parameters:
        - $ref: '#/components/parameters/OutletHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StockCountUpdateInput' }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OkResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: "action not allowed in this status, another count at the location is in progress, or lock conflict (retryable)" }
    get:
      operationId: getStockCount
      tags: [sales]
      summary: Get stock count (outlet-scoped)
      parameters:
        - $ref: '#/components/parameters/OutletHeader'
      responses:
        '200':
          description: stock count
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StockCountResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/stock-counts/{id}/complete:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: completeStockCount
      tags: [sales]
      summary: >
        Complete stock count — adds each counted line's difference (counted minus
        baseline) to live stock in one tx, so sales made during the count are kept,
        and bumps the content version (outlet counts). Completing a completed count
        is a no-op that returns it. Items may only update actualQty of existing lines.
      parameters:
        - $ref: '#/components/parameters/OutletHeader'
