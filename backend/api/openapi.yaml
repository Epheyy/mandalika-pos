        locationType: { $ref: '#/components/schemas/InventoryLocationType' }
        locationId: { type: string, format: uuid }
        productId: { type: string, format: uuid }
        variantSize: { type: string }
        newQty: { type: integer, minimum: 0 }
        reasonCode: { $ref: '#/components/schemas/InventoryReasonCode' }
        reasonText: { type: string, description: "Required when reasonCode is other." }
    AdjustmentRequest:
      type: object
      required: [id, number, status, locationType, locationId, productId, variantSize, qtyAtRequest, requestedNewQty, reasonCode, requestedBy, requestedAt]
      properties:
        id: { type: string, format: uuid }
        number: { type: string }
        status: { $ref: '#/components/schemas/AdjustmentRequestStatus' }
        locationType: { $ref: '#/components/schemas/InventoryLocationType' }
        locationId: { type: string, format: uuid }
        locationName: { type: string }
        productId: { type: string, format: uuid }
        productName: { type: string }
        variantSize: { type: string }
        sku: { type: string }
        qtyAtRequest: { type: integer, description: "Live quantity the requester saw; server-read." }
        requestedNewQty: { type: integer }
        liveQty: { type: integer, description: "Current live quantity, for the drift shown on the approval card." }
        reasonCode: { $ref: '#/components/schemas/InventoryReasonCode' }
        reasonText: { type: string }
        requestedBy: { type: string, format: uuid }
        requestedByName: { type: string }
        requestedAt: { type: string, format: date-time }
        approvedBy: { type: string, format: uuid }
        approvedByName: { type: string }
        approvedAt: { type: string, format: date-time }
        decisionNote: { type: string }
        appliedAdjustmentId: { type: string, format: uuid }
        events: { type: array, items: { $ref: '#/components/schemas/InventoryDocEvent' } }
    AdjustmentRequestResponse:
