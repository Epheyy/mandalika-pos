        '400': { description: invalid body, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: "same body for unknown, ineligible, no-PIN and wrong-PIN approver, or the transfer is not for this outlet", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { description: transfer not found, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { description: "transfer not in transit, or this receipt key was already used", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '429':
          description: locked out after repeated wrong PINs; see Retry-After (seconds, absent on a hard lock) and the body
          headers:
            Retry-After: { schema: { type: integer } }
          content: { application/json: { schema: { $ref: '#/components/schemas/ReceiveApprovalLocked' } } }
