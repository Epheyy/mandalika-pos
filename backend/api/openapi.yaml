        totalOrders: { type: integer }
        totalRefunds: { type: number, format: double }
        cashSales: { type: number, format: double }
        cardSales: { type: number, format: double }
        transferSales: { type: number, format: double }
        qrisSales: { type: number, format: double }
        # Per-method counted cash entered by the cashier at close (reconciliation
        # "Terhitung"). Keys are payment-method ids; null when not reconciled.
        countedByMethod:
          type: object
          additionalProperties: { type: number, format: double }
          nullable: true
        # A06: refunds this shift paid out for sales of OTHER shifts. Live while the
        # shift is open, a close-time snapshot afterwards (null on shifts closed
        # before the field existed). cashRefundsPaid is its cash part by the isCash rule:
        # computed live while open, the snapshot once closed, null when closed before
        # the field existed.
        cashRefundsPaid: { type: number, format: double, nullable: true }
