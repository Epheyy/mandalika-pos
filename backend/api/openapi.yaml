      summary: One ERP outbox document with its payload and the ERP response (admin)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: outbox row
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErpOutboxDetailResponse' }
