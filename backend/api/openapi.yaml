  /api/v1/customers/import:
    post:
      operationId: importCustomers
      tags: [imports]
      summary: CSV customer import, dry run or commit (manage_customers)
      description: >
        dryRun=true parses, validates and plans against current data inside a read-only
        transaction and returns the report. dryRun=false needs the Idempotency-Key header
        plus the preview's fileSha256 and expectedSummary, re-plans under an advisory lock
        and applies all-or-nothing (422 with the report and nothing written when any row
        has an error; 409 when the data changed since the preview). Duplicate phones are
        skipped, never merged.
      parameters:
        - $ref: '#/components/parameters/ImportIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CsvImportRequest' }
      responses:
        '200': { $ref: '#/components/responses/ImportReportOK' }
        '400': { description: invalid request }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/ImportConflict' }
        '413': { description: 'request body over the 20 MiB cap', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '429': { description: 'two imports already running in this process; retry shortly', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '503': { description: 'busy (lock conflict), nothing applied, retry', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { $ref: '#/components/responses/ImportRejected' }
  /api/v1/products/import:
    post:
      operationId: importProducts
      tags: [imports]
      summary: CSV product import, dry run or commit (manage_products)
      description: >
        Merge-only: never deletes a product or variant and never writes stock, images,
        favourites or per-outlet availability or price (a size rename re-keys the existing per-outlet stock, price and warehouse rows). Same dry run and commit contract as the customer
        import.
      parameters:
        - $ref: '#/components/parameters/ImportIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CsvImportRequest' }
      responses:
        '200': { $ref: '#/components/responses/ImportReportOK' }
        '400': { description: invalid request }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/ImportConflict' }
        '413': { description: 'request body over the 20 MiB cap', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '429': { description: 'two imports already running in this process; retry shortly', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '503': { description: 'busy (lock conflict), nothing applied, retry', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { $ref: '#/components/responses/ImportRejected' }
  /api/v1/ingredients/import:
    post:
      operationId: importIngredients
      tags: [imports]
      summary: CSV ingredient import, dry run or commit (manage_inventory, recipes module)
      description: Same dry run and commit contract as the customer import. Ingredient stock is never touched.
      parameters:
        - $ref: '#/components/parameters/ImportIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
