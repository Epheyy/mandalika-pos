        actualQty: { type: integer, nullable: true }
        difference: { type: integer, nullable: true }
    StockCount:
      type: object
      required: [id, name, status, items, createdBy, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        status: { type: string, enum: [planned, in_progress, completed, cancelled] }
        outletId: { type: string, format: uuid, nullable: true }
        warehouseId: { type: string, format: uuid, nullable: true }
        plannedDate: { type: string, nullable: true }
        startedAt: { type: string, format: date-time, nullable: true }
        completedAt: { type: string, format: date-time, nullable: true }
        items: { type: array, items: { $ref: '#/components/schemas/StockCountItem' } }
        notes: { type: string, nullable: true }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
    StockCountListResponse:
      type: object
      required: [data]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/StockCount' } }
        meta: { $ref: '#/components/schemas/Meta' }
    StockCountResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/StockCount' }
    CashFlow:
      type: object
      required: [id, outletId, type, amount, description, createdAt]
      properties:
        id: { type: string, format: uuid }
        outletId: { type: string, format: uuid }
        shiftId: { type: string, nullable: true }
        type: { type: string }
        amount: { type: number }
        description: { type: string }
        cashierId: { type: string, nullable: true }
        cashierName: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
    CashFlowListResponse:
      type: object
      required: [data]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/CashFlow' } }
        meta: { $ref: '#/components/schemas/Meta' }
    PaymentMethodConfig:
      type: object
      required: [id, label, isEnabled]
      properties:
        id: { type: string }
        label: { type: string }
        isEnabled: { type: boolean }
        isCash:
          type: boolean
          nullable: true
          description: Money goes into the cash drawer. Absent/null = default by id (cash, tunai).
    ReceiptSettings:
      type: object
      required: [headerText, footerText, showTax, showCashier]
      properties:
        headerText: { type: string }
        footerText: { type: string }
        showTax: { type: boolean }
        showCashier: { type: boolean }
        copies: { type: integer, nullable: true }
        autoPrint: { type: boolean, nullable: true }
        showOrderNumber: { type: boolean, nullable: true }
        showCustomerName: { type: boolean, nullable: true }
        showCustomerPhone: { type: boolean, nullable: true }
        showDiscount: { type: boolean, nullable: true }
        showSubtotal: { type: boolean, nullable: true }
        showChange: { type: boolean, nullable: true }
    AppSettings:
      type: object
      required: [taxEnabled, taxRate, roundingEnabled, roundingType, paymentMethods, receipt, autoOpenShift, allowNegativeStock]
      properties:
        taxEnabled: { type: boolean }
        taxRate: { type: number }
        roundingEnabled: { type: boolean }
        roundingType: { type: string, enum: [nearest_500, nearest_1000, none] }
        roundingAmount: { type: number, nullable: true }
        roundingDirection: { type: string, enum: [floor, ceil, nearest], nullable: true }
        roundingApplyToTax: { type: boolean, nullable: true }
        paymentMethods: { type: array, items: { $ref: '#/components/schemas/PaymentMethodConfig' } }
        receipt: { $ref: '#/components/schemas/ReceiptSettings' }
        autoOpenShift: { type: boolean }
        allowNegativeStock: { type: boolean }
        receiveApproverRoles:
          type: array
          items: { type: string }
          description: Roles whose users may approve a POS transfer receive.
        documents:
          $ref: '#/components/schemas/DocumentSettings'
        recipesEnabled: { type: boolean }
    AppSettingsResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/AppSettings' }
    DocumentSettings:
      type: object
      properties:
        logoUrl:      { type: string, nullable: true }
        brandName:    { type: string, nullable: true }
        addressLines: { type: string, nullable: true }   # multiline; newline-separated
        phone:        { type: string, nullable: true }
        npwp:         { type: string, nullable: true }
    CustomRole:
      type: object
      required: [id, name, permissions, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        permissions: { type: array, items: { type: string } }
        createdAt: { type: string, format: date-time }
    CustomRoleListResponse:
      type: object
      required: [data]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/CustomRole' } }
    CustomRoleInput:
      type: object
      required: [name, permissions]
      properties:
        name: { type: string }
        permissions: { type: array, items: { type: string } }
    StockCountCreateInput:
      type: object
      required: [name, items]
      properties:
        name: { type: string }
        warehouseId: { type: string, format: uuid, nullable: true }
        plannedDate: { type: string, nullable: true }
        notes: { type: string, nullable: true }
        items: { type: array, items: { $ref: '#/components/schemas/StockCountItem' } }
    StockCountUpdateInput:
      type: object
      properties:
        status: { type: string, enum: [in_progress, cancelled], nullable: true }
        notes: { type: string, nullable: true }
        items:
          type: array
          nullable: true
          items: { $ref: '#/components/schemas/StockCountItem' }
    StockCountCompleteInput:
      type: object
      properties:
        items:
          type: array
          nullable: true
          items: { $ref: '#/components/schemas/StockCountItem' }
    ProductSalesRow:
      type: object
      required: [productId, productName, quantity, revenue]
      properties:
        productId: { type: string }
        productName: { type: string }
        quantity: { type: integer }
        revenue: { type: number }
    DailySalesRow:
      type: object
      required: [date, sales, orders]
      properties:
        date: { type: string }
        sales: { type: number }
        orders: { type: integer }
    ReportSummary:
      type: object
      required: [from, to, totalSales, totalOrders, totalRefunds, netSales, avgOrderValue, byPaymentMethod, topProducts, dailySales]
      properties:
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        outletId: { type: string, nullable: true }
        totalSales: { type: number }
        totalOrders: { type: integer }
        totalRefunds: { type: number }
        netSales: { type: number }
        avgOrderValue: { type: number }
        byPaymentMethod:
          type: object
          additionalProperties: { type: number }
        topProducts: { type: array, items: { $ref: '#/components/schemas/ProductSalesRow' } }
        dailySales: { type: array, items: { $ref: '#/components/schemas/DailySalesRow' } }
    ReportSummaryResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/ReportSummary' }
    IdResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [id]
          properties:
            id: { type: string, format: uuid }
    OkResponse:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }
    OrderItemInput:
      type: object
      required: [productId, productName, variantSize, price, quantity, subtotal]
      properties:
        productId: { type: string }
        productName: { type: string }
        variantSize: { type: string }
        price: { type: number }
        quantity: { type: integer }
        subtotal: { type: number }
        isBundle: { type: boolean }
        isReward: { type: boolean }
        rewardConditionId: { type: string }
        rewardPromotionId: { type: string }
    CreateOrderRequest:
      type: object
      required: [orderUuid, items, paymentMethod]
      description: >
        Server recomputes all money/stock/loyalty (plan §9); client values are
        provisional. Outlet + cashier come from the JWT. The Idempotency-Key
        header is required.
      properties:
        orderUuid: { type: string, format: uuid }
        deviceId: { type: string, nullable: true }
        salesmanId: { type: string, nullable: true }
        salesmanName: { type: string, nullable: true }
        customerId: { type: string, nullable: true }
        customerName: { type: string, nullable: true }
        items: { type: array, items: { $ref: '#/components/schemas/OrderItemInput' } }
        paymentMethod: { type: string, description: configured payment method id (free-form since migration 0005) }
        amountPaid: { type: number }
        discountType: { type: string, enum: [percentage, fixed], nullable: true }
        discountValue: { type: number, nullable: true }
        surchargeValue: { type: number, nullable: true }
        discountCode: { type: string, nullable: true }
        promotionId: { type: string, nullable: true }
        promotionIds: { type: array, items: { type: string }, nullable: true }
        discountCodes: { type: array, items: { type: string }, nullable: true }
        discountLabel: { type: string, nullable: true }
        discountBreakdown:
          type: array
          nullable: true
          items: { $ref: '#/components/schemas/DiscountComponent' }
        notes: { type: string, nullable: true }
        shiftId: { type: string, nullable: true }
    RefundRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string }
    OpenShiftRequest:
      type: object
      required: [startingCash]
      properties:
        outletName: { type: string, nullable: true }
        startingCash: { type: number }
    CloseShiftRequest:
      type: object
      required: [closingCash]
      properties:
        closingCash: { type: number }
        # Optional per-method counted cash captured at close (reconciliation).
        countedByMethod:
          type: object
          nullable: true
          additionalProperties: { type: number }
    CashFlowRequest:
      type: object
      required: [type, amount, description]
      properties:
        shiftId: { type: string, nullable: true }
        type: { type: string }
        amount: { type: number }
        description: { type: string }
    SyncVersion:
      type: object
      required: [version, dataManifest]
      properties:
        version: { type: integer, format: int64 }
        dataManifest: { type: object, additionalProperties: true }
    SyncVersionResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/SyncVersion' }
    SyncPullBundle:
      type: object
      required: [version]
      properties:
        version: { type: integer, format: int64 }
        outletCode: { type: string, nullable: true }
        outletName: { type: string, nullable: true }
        products: { type: array, items: { $ref: '#/components/schemas/Product' } }
        categories: { type: array, items: { $ref: '#/components/schemas/Category' } }
        bundles: { type: array, items: { $ref: '#/components/schemas/Bundle' } }
        customers: { type: array, items: { $ref: '#/components/schemas/Customer' } }
        promotions: { type: array, items: { $ref: '#/components/schemas/Promotion' } }
        discountCodes: { type: array, items: { $ref: '#/components/schemas/DiscountCode' } }
        loyaltyConditions: { type: array, items: { $ref: '#/components/schemas/LoyaltyCondition' } }
        loyaltySettings: { $ref: '#/components/schemas/LoyaltySettings' }
        appSettings: { $ref: '#/components/schemas/AppSettings' }
        users: { type: array, items: { $ref: '#/components/schemas/User' } }
        receiveApprovers: { type: array, items: { $ref: '#/components/schemas/ReceiveApprover' } }
    SyncPullResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/SyncPullBundle' }
    SyncBatchItem:
      type: object
      required: [type, idempotencyKey, payload]
      properties:
        type: { type: string, enum: [order, refund, shift_open, shift_close, cash_flow, customer_create, transfer_receive] }
        idempotencyKey: { type: string }
        payload: { type: object, additionalProperties: true }
        # Optional and NOT nullable: openapi-typescript drops nullable on $ref schemas, so
        # "absent" is the only legacy/unset form (A04). Sibling of payload, never inside it.
        envelope: { $ref: '#/components/schemas/SyncEnvelope' }
    SyncEnvelope:
      type: object
      description: >-
        Capture-time identity stamped by the POS when the operation was committed to the
        outbox (A04). The server attributes the item to this outlet/user instead of the
        flush-time request headers, after verifying it against the authenticated caller.
      required: [v, outletId, userId, deviceId, capturedAt]
      properties:
        v: { type: integer, description: Envelope format version; 1 is the only version defined. }
        outletId: { type: string }
        userId: { type: string }
        deviceId: { type: string }
        capturedAt: { type: string, format: date-time }
        shiftId: { type: string }
        appVersion: { type: string }
    SyncBatchRequest:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/SyncBatchItem' } }
    SyncItemResult:
      type: object
      required: [idempotencyKey, status]
      properties:
        idempotencyKey: { type: string }
        status: { type: string, enum: [ok, duplicate, error] }
        orderId: { type: string }
        stockWarning: { type: boolean }
        error: { type: string }
        code:
          type: string
          enum: [rejected, forbidden, not_found, conflict, competing_receipt, key_conflict, busy, internal, actor_mismatch]
          description: >-
            Machine-readable outcome, present exactly when status is "error". Clients must
            treat a missing or unknown code as the pre-contract behaviour (an older server,
            e.g. after a rollback, omits it). actor_mismatch = the item's capture-time envelope did not match the authenticated caller (A04).
        retryable:
          type: boolean
          description: >-
            Present exactly when status is "error" (false is still sent). true = nothing was
            applied and a later retry may succeed (busy, internal); false = the server refused
            the item and it needs review.
        tandaTerimaNo: { type: string, nullable: true }   # set on transfer_receive ok
        transfer:                                          # full completed snapshot on transfer_receive ok
          $ref: '#/components/schemas/Transfer'
          nullable: true
    SyncBatchResult:
      type: object
      required: [processed, results, version]
      properties:
        processed: { type: integer }
        results: { type: array, items: { $ref: '#/components/schemas/SyncItemResult' } }
        version: { type: integer, format: int64 }
    SyncBatchResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/SyncBatchResult' }
    UploadSignRequest:
      type: object
      properties:
        folder: { type: string }
    UploadSignature:
      type: object
      required: [timestamp, signature, apiKey, cloudName]
      properties:
        timestamp: { type: integer, format: int64 }
        signature: { type: string }
        apiKey: { type: string }
        cloudName: { type: string }
        folder: { type: string }
    UploadSignResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/UploadSignature' }
    ProductInput:
      type: object
      required: [name, brand, categoryId, variants, isActive]
      properties:
        name: { type: string }
        brand: { type: string }
        categoryId: { type: string }
        description: { type: string }
        imageUrl: { type: string }
        images: { type: array, items: { type: string }, nullable: true }
        sellable: { type: boolean, nullable: true }
        variants: { type: array, items: { $ref: '#/components/schemas/ProductVariant' } }
        isFeatured: { type: boolean }
        isFavourite: { type: boolean }
        isActive: { type: boolean }
    OutletVariantConfig:
      type: object
      required: [outletId, outletName, variantSize, stock, available]
      properties:
        outletId: { type: string, format: uuid }
        outletName: { type: string }
        variantSize: { type: string }
        stock: { type: integer }
        # null = use the variant's base price (no per-outlet override)
        price: { type: number, nullable: true }
        available: { type: boolean }
        parLevel: { type: integer, nullable: true }
    OutletConfigResponse:
      type: object
      required: [data]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/OutletVariantConfig' } }
    OutletConfigItemInput:
      type: object
      required: [outletId, variantSize, available]
      properties:
        outletId: { type: string, format: uuid }
        variantSize: { type: string }
        # null = use the variant's base price (no per-outlet override)
        price: { type: number, nullable: true }
        available: { type: boolean }
    OutletConfigInput:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/OutletConfigItemInput' } }
    CategoryInput:
      type: object
      required: [name]
      properties:
        name: { type: string }
        description: { type: string }
        sortOrder: { type: integer, nullable: true }
    CustomerInput:
      type: object
      required: [name, phone]
      properties:
        name: { type: string }
        phone: { type: string }
        email: { type: string }
        birthday: { type: string }
        anniversary: { type: string }
        notes: { type: string }
    PromotionInput:
      type: object
      required: [name, type, value, isActive]
      properties:
        name: { type: string }
        description: { type: string }
        type: { type: string, enum: [percentage, fixed, bogo, buy_x_get_y, tiered, bundle] }
        value: { type: number }
        minPurchase: { type: number, nullable: true }
        applicableProductIds: { type: array, items: { type: string } }
        applicableVariantKeys: { type: array, items: { type: string } }
        applicableVariantSizes: { type: array, items: { type: string } }
        outletIds: { type: array, items: { type: string } }
        combinable: { type: boolean, nullable: true }
        combinableWith: { type: array, items: { type: string } }
        activeFromHour: { type: string }
        activeToHour: { type: string }
        activeDays: { type: array, items: { type: integer } }
        isActive: { type: boolean }
        startDate: { type: string }
        endDate: { type: string }
        codeOnly:
          type: boolean
          description: When true, hidden from the POS panel; reachable only via a linked discount code.
        bxgyConfig:
          allOf: [{ $ref: '#/components/schemas/BXGYConfig' }]
          nullable: true
        tieredConfig:
          allOf: [{ $ref: '#/components/schemas/TieredConfig' }]
          nullable: true
        bundleConfig:
          allOf: [{ $ref: '#/components/schemas/BundleConfig' }]
          nullable: true
    DiscountCodeInput:
      type: object
      required: [code, type, value, isActive]
      properties:
        code: { type: string }
        promotionId: { type: string }
        type: { type: string, enum: [percentage, fixed] }
        value: { type: number }
        minPurchase: { type: number, nullable: true }
        usageLimit: { type: integer, nullable: true }
        perCustomerLimit: { type: integer, nullable: true }
        customerId:
          type: string
          nullable: true
        isActive: { type: boolean }
        startDate: { type: string }
        endDate: { type: string }
        combinable: { type: boolean, nullable: true }
    DiscountCodeBatchInput:
      type: object
      required: [type, value, count]
      properties:
        count: { type: integer }
        prefix: { type: string }
        suffixLength: { type: integer }
        promotionId: { type: string }
        type: { type: string, enum: [percentage, fixed] }
        value: { type: number }
        minPurchase: { type: number, nullable: true }
        usageLimit: { type: integer, nullable: true }
        perCustomerLimit: { type: integer, nullable: true }
        isActive: { type: boolean }
        startDate: { type: string }
        endDate: { type: string }
        combinable: { type: boolean, nullable: true }
    OutletInput:
      type: object
      required: [name, isActive]
      properties:
        name: { type: string }
        code: { type: string }
        address: { type: string }
        phone: { type: string }
        logoUrl: { type: string, nullable: true }
        isActive: { type: boolean }
    ReceiveApprover:
      type: object
      required: [userId, displayName, receivePinHash]
      properties:
        userId: { type: string, format: uuid }
        displayName: { type: string }
        receivePinHash: { type: string }
    ResetUserPasswordRequest:
      type: object
      required: [password]
      properties:
        password: { type: string, format: password, minLength: 8, maxLength: 128 }
    SetReceivePinRequest:
      type: object
      properties:
        pin: { type: string, minLength: 4, maxLength: 8, nullable: true }
        clear: { type: boolean, nullable: true }
    OutletParInput:
      type: object
      required: [productId, variantSize]
      properties:
        productId: { type: string, format: uuid }
        variantSize: { type: string }
        parLevel: { type: integer, nullable: true }
    InventoryOverviewLocation:
      type: object
      required: [id, kind, name]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [outlet, warehouse] }
        name: { type: string }
    InventoryOverviewCell:
      type: object
      required: [locationId, stock]
      properties:
        locationId: { type: string, format: uuid }
        stock: { type: integer }
        belowPar: { type: boolean, nullable: true }
    InventoryOverviewRow:
      type: object
      required: [productId, productName, variantSize, total, cells]
      properties:
        productId: { type: string, format: uuid }
        productName: { type: string }
        variantSize: { type: string }
        sku: { type: string }
        total: { type: integer }
        cells: { type: array, items: { $ref: '#/components/schemas/InventoryOverviewCell' } }
    InventoryOverviewResponse:
      type: object
      required: [locations, rows]
      properties:
        locations: { type: array, items: { $ref: '#/components/schemas/InventoryOverviewLocation' } }
        rows: { type: array, items: { $ref: '#/components/schemas/InventoryOverviewRow' } }
    IngredientOverviewCell:
      type: object
      required: [locationId, qty]
      properties:
        locationId: { type: string, format: uuid }
        qty: { type: number }
    IngredientOverviewRow:
      type: object
      required: [ingredientId, ingredientName, unit, total, cells]
      properties:
        ingredientId: { type: string, format: uuid }
        ingredientName: { type: string }
        sku: { type: string }
        unit: { type: string }
        total: { type: number }
        cells:
          type: array
          items: { $ref: '#/components/schemas/IngredientOverviewCell' }
    IngredientOverviewResponse:
      type: object
      required: [locations, rows]
      properties:
        locations:
          type: array
          items: { $ref: '#/components/schemas/InventoryOverviewLocation' }
        rows:
          type: array
          items: { $ref: '#/components/schemas/IngredientOverviewRow' }
    MovementSummaryRow:
      type: object
      required: [productId, productName, variantSize, sku, currentStock, goodsIn, sold, refunded, transferIn, transferOut, adjustmentCount, opnameDiff]
      properties:
        productId: { type: string, format: uuid }
        productName: { type: string }
        variantSize: { type: string }
        sku: { type: string }
        currentStock: { type: integer }
        goodsIn: { type: integer }
        sold: { type: integer }
        refunded: { type: integer }
        transferIn: { type: integer }
        transferOut: { type: integer }
        adjustmentCount: { type: integer }
        opnameDiff: { type: integer }
    MovementSummaryResponse:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/MovementSummaryRow' } }
        meta: { $ref: '#/components/schemas/Meta' }
  responses:
    Unauthorized:
      description: unauthenticated
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: insufficient role/permission/outlet
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

paths:
  /healthz:
    get:
      operationId: health
      tags: [auth]
      security: []
      summary: Liveness/readiness (DB + Redis)
      responses:
        '200': { description: ok }
        '503': { description: dependency down }
  /api/v1/auth/login:
    post:
      operationId: login
      tags: [auth]
      security: []
      summary: Email/password login → JWT access + refresh
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
