      properties:
        productId: { type: string }
        productName: { type: string }
        quantity: { type: integer }
        revenue: { type: number, format: double }
    DailySalesRow:
      type: object
      required: [date, sales, orders, grossSales, grossOrders, refunds, refundedOrders, netSales]
      description: |
        One row per business day that has a sale or a refund. sales/orders are still-completed rows
        by SALE day; grossSales/grossOrders are completed+refunded rows by sale day; refunds/refundedOrders
        are refunds by REFUND day; netSales = grossSales - refunds.
      properties:
        date: { type: string }
        sales: { type: number, format: double }
        orders: { type: integer }
        grossSales: { type: number, format: double }
        grossOrders: { type: integer }
        refunds: { type: number, format: double }
        refundedOrders: { type: integer }
        netSales: { type: number, format: double }
    ReportSummary:
      type: object
      required: [totalSales, totalOrders, totalRefunds, refundedOrders, netSales, avgOrderValue, byPaymentMethod, topProducts, dailySales, grossSales, grossOrders, grossByPaymentMethod, refundsByPaymentMethod]
      description: |
        A27: sales are recognised on the SALE business day, refunds on the REFUND business day.
        totalSales/totalOrders/byPaymentMethod/avgOrderValue/topProducts = still-completed rows by sale day.
        grossSales/grossOrders = completed+refunded rows by sale day. totalRefunds/refundedOrders = refunded
        rows by refund day. netSales = grossSales - totalRefunds (may be negative; NOT totalSales - totalRefunds).
        grossByPaymentMethod groups gross, refundsByPaymentMethod groups refunds by the ORIGINAL payment method.
        status=completed empties the refund side; cancelled rows are never money.
        Money fields are `format: double` so totals above 2^24 stay exact (float32 rounded them).
        `from`/`to` echo only the legacy instant parameters; null when that side is not given.
        `dateFrom`/`dateTo` echo the business days applied; null when that side is unbounded.
      properties:
        from: { type: string, format: date-time, nullable: true }
        to: { type: string, format: date-time, nullable: true }
        dateFrom: { type: string, format: date, nullable: true }
        dateTo: { type: string, format: date, nullable: true }
        outletId: { type: string, nullable: true }
        totalSales: { type: number, format: double }
        totalOrders: { type: integer }
        totalRefunds: { type: number, format: double }
        refundedOrders: { type: integer }
        netSales: { type: number, format: double }
        grossSales: { type: number, format: double }
        grossOrders: { type: integer }
        avgOrderValue: { type: number, format: double }
        byPaymentMethod:
          type: object
          additionalProperties: { type: number, format: double }
        grossByPaymentMethod:
          type: object
          additionalProperties: { type: number, format: double }
        refundsByPaymentMethod:
          type: object
          additionalProperties: { type: number, format: double }
        topProducts: { type: array, items: { $ref: '#/components/schemas/ProductSalesRow' } }
        dailySales: { type: array, items: { $ref: '#/components/schemas/DailySalesRow' } }
    ReportSummaryResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/ReportSummary' }
    IdResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [id]
          properties:
            id: { type: string, format: uuid }
    OkResponse:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }
    ErrorLogAcceptedResponse:
      type: object
      required: [ok, accepted]
      properties:
        ok: { type: boolean }
        accepted: { type: integer }
    OrderItemInput:
      type: object
      required: [productId, productName, variantSize, price, quantity, subtotal]
      properties:
        productId: { type: string }
        productName: { type: string }
        variantSize: { type: string }
        price: { type: number, format: double }
        quantity: { type: integer }
        subtotal: { type: number, format: double }
        isBundle: { type: boolean }
        isReward: { type: boolean }
        rewardConditionId: { type: string }
        rewardPromotionId: { type: string }
    CreateOrderRequest:
      type: object
      required: [orderUuid, items, paymentMethod]
      description: >
        Server recomputes all money/stock/loyalty (plan §9); client values are
        provisional. Outlet + cashier come from the JWT. The Idempotency-Key
        header is required.
      properties:
        orderUuid: { type: string, format: uuid }
        deviceId: { type: string, nullable: true }
        salesmanId: { type: string, nullable: true }
        salesmanName: { type: string, nullable: true }
        customerId: { type: string, nullable: true }
        customerName: { type: string, nullable: true }
        items: { type: array, items: { $ref: '#/components/schemas/OrderItemInput' } }
        paymentMethod: { type: string, description: configured payment method id (free-form since migration 0005) }
        amountPaid: { type: number, format: double }
        discountType: { type: string, enum: [percentage, fixed], nullable: true }
        discountValue: { type: number, format: double, nullable: true }
        surchargeValue: { type: number, format: double, nullable: true }
        discountCode: { type: string, nullable: true }
        promotionId: { type: string, nullable: true }
        promotionIds: { type: array, items: { type: string }, nullable: true }
        discountCodes: { type: array, items: { type: string }, nullable: true }
        discountLabel: { type: string, nullable: true }
        discountBreakdown:
          type: array
          nullable: true
          items: { $ref: '#/components/schemas/DiscountComponent' }
        notes: { type: string, nullable: true }
        shiftId: { type: string, nullable: true }
        # A10: what the cashier showed and printed. Stored unchanged; the server total
        # stays authoritative and a difference only raises quoteWarning (never rejects).
        quotedTotal: { type: number, format: double, nullable: true }
        receiptSnapshot:
          type: object
          nullable: true
          additionalProperties: true
          description: Printed receipt (v, refVersion, money fields, lines). No customer name or phone.
    RefundRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 500 }
    OpenShiftRequest:
      type: object
      required: [startingCash]
      properties:
        outletName: { type: string, nullable: true }
        startingCash: { type: number, format: double }
    CloseShiftRequest:
      type: object
      required: [closingCash]
      properties:
        closingCash: { type: number, format: double }
        # Optional per-method counted cash captured at close (reconciliation).
        countedByMethod:
          type: object
          nullable: true
          additionalProperties: { type: number, format: double }
    CashFlowRequest:
      type: object
      required: [type, amount, description]
      properties:
        shiftId: { type: string, nullable: true }
        type: { type: string }
        amount: { type: number, format: double }
        description: { type: string }
    SyncVersion:
      type: object
      required: [version, dataManifest]
      properties:
        version: { type: integer, format: int64 }
        dataManifest: { type: object, additionalProperties: true }
        # Optional and NOT nullable ($ref + nullable is dropped by openapi-typescript).
        # Present only when the request carried a valid deviceId (A05).
        contact: { $ref: '#/components/schemas/OfflineContact' }
        stockSeq:
          type: integer
          format: int64
          description: >-
            The outlet's stock change counter (A15 Phase B), read in the same statement as
            version. Optional and NOT nullable: absent means "no signal" (older server or
            SYNC_STOCK_SEQ=off), never 0; a real 0 is sent.
    OfflineContact:
      type: object
      description: >-
        Server-signed proof of the tablet's last successful online contact (A05).
        at is server time (RFC 3339, kept verbatim); sig binds it to the device id.
        A client cannot mint a later contact.
      required: [at, sig]
      properties:
        at: { type: string, format: date-time }
        sig: { type: string }
    SyncVersionResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/SyncVersion' }
    SyncPullBundle:
      type: object
      required: [version]
      properties:
        version: { type: integer, format: int64 }
        stockSeq:
          type: integer
          format: int64
          description: >-
            The outlet stock counter as of the moment version was read, BEFORE the products
            were read: the stock in this bundle covers every change up to stockSeq. Optional
            and NOT nullable; absent = no signal.
        outletCode: { type: string, nullable: true }
        outletName: { type: string, nullable: true }
        outletTimezone:
          type: string
          enum: [Asia/Jakarta, Asia/Makassar, Asia/Jayapura]
          description: The outlet's timezone; promo hours, active days and start/end dates are evaluated on this clock. Absent (older servers) means Asia/Jakarta.
        products: { type: array, items: { $ref: '#/components/schemas/Product' } }
        categories: { type: array, items: { $ref: '#/components/schemas/Category' } }
        bundles: { type: array, items: { $ref: '#/components/schemas/Bundle' } }
        customers:
          type: array
          deprecated: true
          description: Always empty (A30). Kept so older POS bundles still parse; cashiers find customers by phone via lookupCustomers.
          items: { $ref: '#/components/schemas/Customer' }
        promotions: { type: array, items: { $ref: '#/components/schemas/Promotion' } }
        discountCodes: { type: array, items: { $ref: '#/components/schemas/DiscountCode' } }
        loyaltyConditions: { type: array, items: { $ref: '#/components/schemas/LoyaltyCondition' } }
        loyaltySettings: { $ref: '#/components/schemas/LoyaltySettings' }
        appSettings: { $ref: '#/components/schemas/AppSettings' }
        users: { type: array, items: { $ref: '#/components/schemas/User' } }
        receiveApprovers:
          type: array
          description: Always empty since A08 (kept so older bundles still parse). Approvers come from GET /sync/receive-approvers and no PIN hash is shipped.
          items: { $ref: '#/components/schemas/ReceiveApprover' }
    SyncPullResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/SyncPullBundle' }
    SyncBatchItem:
      type: object
      required: [type, idempotencyKey, payload]
      properties:
        type: { type: string, enum: [order, refund, shift_open, shift_close, cash_flow, customer_create, transfer_receive] }
        idempotencyKey: { type: string }
        payload:
          type: object
          additionalProperties: true
          description: >-
            Per-type body. For transfer_receive (A08) it carries transferId, items,
            discrepancyReason and approvalGrantId (from createTransferReceiveApproval); it
            never carries a pin, and the server ignores any approverUserId (the approver is the
            grant's). An item without a
            usable grant is refused as forbidden and goes to review.
        # Optional and NOT nullable: openapi-typescript drops nullable on $ref schemas, so
        # "absent" is the only legacy/unset form (A04). Sibling of payload, never inside it.
        envelope: { $ref: '#/components/schemas/SyncEnvelope' }
    SyncEnvelope:
      type: object
      description: >-
        Capture-time identity stamped by the POS when the operation was committed to the
        outbox (A04). The server attributes the item to this outlet/user instead of the
        flush-time request headers, after verifying it against the authenticated caller.
      required: [v, outletId, userId, deviceId, capturedAt]
      properties:
        v: { type: integer, description: Envelope format version; 1 is the only version defined. }
        outletId: { type: string }
        userId: { type: string }
        deviceId: { type: string }
        capturedAt: { type: string, format: date-time }
        shiftId: { type: string }
        appVersion: { type: string }
        # A05 offline-cap evidence. All optional; v stays 1 so a rolled-back server still
        # accepts the envelope. contact is NOT nullable ($ref codegen gotcha).
        contact: { $ref: '#/components/schemas/OfflineContact' }
        contactDeviceAt: { type: integer, format: int64, description: Device clock (ms) at the last online contact. }
        offlineMs: { type: integer, format: int64, minimum: 0, description: Device-measured time offline (ms) at capture. }
    SyncReviewReport:
      type: object
      required: [idempotencyKey, type, clientCreatedAt, payload]
      properties:
        idempotencyKey: { type: string, maxLength: 200 }
        type:
          type: string
          enum: [order, refund, shift_open, shift_close, cash_flow, customer_create, transfer_receive]
        reviewCode: { type: string }
        reviewReason: { type: string }
        lastError: { type: string }
        ownerUserId: { type: string }
        capturedOutletId: { type: string }
        clientCreatedAt: { type: string, format: date-time }
        payload: { type: object, additionalProperties: true }
    SyncReviewReportRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 200
          items: { $ref: '#/components/schemas/SyncReviewReport' }
    PosDeviceRegisterRequest:
      type: object
      required: [deviceId]
      properties:
        deviceId: { type: string, format: uuid }
    PosDeviceRegisterResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [code]
          properties:
            code: { type: string, description: 'Receipt-number device tag at the caller outlet: AA, AB ... ZZ, AAA ...' }
    SyncReviewResolution:
      type: object
      required: [idempotencyKey, resolvedAt, resolvedByName, note]
      properties:
        idempotencyKey: { type: string }
        resolvedAt: { type: string, format: date-time }
        resolvedByName: { type: string }
        note: { type: string }
    SyncReviewReportResult:
      type: object
      required: [resolved]
      properties:
        resolved:
          type: array
          items: { $ref: '#/components/schemas/SyncReviewResolution' }
    SyncReviewReportResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/SyncReviewReportResult' }
    SyncReviewItem:
      type: object
      required: [idempotencyKey, outletId, outletName, type, payload, clientCreatedAt, firstReportedAt, lastReportedAt, reportedByName, appliedOnServer]
      properties:
        idempotencyKey: { type: string }
        outletId: { type: string, format: uuid }
        outletName: { type: string }
        capturedOutletId: { type: string, nullable: true }
        capturedOutletName: { type: string, nullable: true }
        type: { type: string }
        reviewCode: { type: string, nullable: true }
        reviewReason: { type: string, nullable: true }
        lastError: { type: string, nullable: true }
        ownerUserId: { type: string, nullable: true }
        ownerName: { type: string, nullable: true }
        payload: { type: object, additionalProperties: true }
        clientCreatedAt: { type: string, format: date-time }
        firstReportedAt: { type: string, format: date-time }
        lastReportedAt: { type: string, format: date-time }
        reportedByName: { type: string }
        resolvedAt: { type: string, format: date-time, nullable: true }
        resolvedByName: { type: string, nullable: true }
        resolutionNote: { type: string, nullable: true }
        appliedOnServer: { type: boolean }
    SyncReviewItemListResponse:
      type: object
      required: [data, meta, openCount]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/SyncReviewItem' }
        meta: { $ref: '#/components/schemas/Meta' }
        openCount: { type: integer }
    SyncReviewResolveRequest:
      type: object
      required: [note]
      properties:
        note: { type: string, minLength: 1, maxLength: 500 }
    SyncReviewResolveResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/SyncReviewResolution' }
    SyncBatchRequest:
      type: object
      required: [items]
      properties:
        items: { type: array, maxItems: 200, items: { $ref: '#/components/schemas/SyncBatchItem' } }
    SyncItemResult:
      type: object
      required: [idempotencyKey, status]
      properties:
        idempotencyKey: { type: string }
        status: { type: string, enum: [ok, duplicate, error] }
        orderId: { type: string }
        stockWarning: { type: boolean }
        error: { type: string }
        code:
          type: string
          enum: [rejected, forbidden, not_found, conflict, competing_receipt, key_conflict, busy, internal, actor_mismatch, offline_expired]
          description: >-
            Machine-readable outcome, present exactly when status is "error". Clients must
            treat a missing or unknown code as the pre-contract behaviour (an older server,
            e.g. after a rollback, omits it). actor_mismatch = the item's capture-time envelope did not match the authenticated caller (A04). offline_expired = the item was captured more than 12 h after the tablet's last online contact (A05); it goes to review.
        retryable:
          type: boolean
          description: >-
            Present exactly when status is "error" (false is still sent). true = nothing was
            applied and a later retry may succeed (busy, internal); false = the server refused
            the item and it needs review.
        stockSeq:
          type: integer
          format: int64
          description: >-
            The outlet stock counter value this sale produced (A15 Phase B). Present only for
            a fresh (status ok) order attributed to the batch caller's own outlet; a duplicate,
            a refund, an error or an order attributed to another outlet carries none. Optional
            and NOT nullable.
        tandaTerimaNo: { type: string, nullable: true }   # set on transfer_receive ok
        transfer:                                          # full completed snapshot on transfer_receive ok
          $ref: '#/components/schemas/Transfer'
          nullable: true
    SyncBatchResult:
      type: object
      required: [processed, results, version]
      properties:
        processed: { type: integer }
        results: { type: array, items: { $ref: '#/components/schemas/SyncItemResult' } }
        version: { type: integer, format: int64 }
        stockSeq:
          type: integer
          format: int64
          description: >-
            The caller outlet's stock counter from the read after the items ran (A15 Phase B).
            Optional and NOT nullable; absent = no signal.
    SyncBatchResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/SyncBatchResult' }
    UploadSignRequest:
      type: object
      properties:
        folder: { type: string }
    UploadSignature:
      type: object
      required: [timestamp, signature, apiKey, cloudName]
      properties:
        timestamp: { type: integer, format: int64 }
        signature: { type: string }
        apiKey: { type: string }
        cloudName: { type: string }
        folder: { type: string }
    UploadSignResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/UploadSignature' }
    ProductInput:
      type: object
      required: [name, brand, categoryId, variants, isActive]
      properties:
        name: { type: string }
        brand: { type: string }
        categoryId: { type: string }
        description: { type: string }
        imageUrl: { type: string }
        images: { type: array, items: { type: string }, nullable: true }
        sellable: { type: boolean, nullable: true }
        variants: { type: array, items: { $ref: '#/components/schemas/ProductVariant' } }
        isFeatured: { type: boolean }
        isFavourite: { type: boolean }
        isActive: { type: boolean }
    OutletVariantConfig:
      type: object
      required: [outletId, outletName, variantSize, stock, available]
      properties:
        outletId: { type: string, format: uuid }
        outletName: { type: string }
        variantSize: { type: string }
        stock: { type: integer }
        # null = use the variant's base price (no per-outlet override)
        price: { type: number, format: double, nullable: true }
        available: { type: boolean }
        parLevel: { type: integer, nullable: true }
    OutletConfigResponse:
      type: object
      required: [data]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/OutletVariantConfig' } }
    OutletConfigItemInput:
      type: object
      required: [outletId, variantSize, available]
      properties:
        outletId: { type: string, format: uuid }
        variantSize: { type: string }
        # null = use the variant's base price (no per-outlet override)
        price: { type: number, format: double, nullable: true }
        available: { type: boolean }
    OutletConfigInput:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/OutletConfigItemInput' } }
    CategoryInput:
      type: object
      required: [name]
      properties:
        name: { type: string }
        description: { type: string }
        sortOrder: { type: integer, nullable: true }
    CustomerInput:
      type: object
      required: [name, phone]
      properties:
        name: { type: string }
        phone: { type: string }
        email: { type: string }
        birthday: { type: string }
        anniversary: { type: string }
        notes: { type: string }
    PromotionInput:
      type: object
      required: [name, type, value, isActive]
      properties:
        name: { type: string }
        description: { type: string }
        type: { type: string, enum: [percentage, fixed, bogo, buy_x_get_y, tiered, bundle] }
        value: { type: number, format: double }
        minPurchase: { type: number, format: double, nullable: true }
        applicableProductIds: { type: array, items: { type: string } }
        applicableVariantKeys: { type: array, items: { type: string } }
        applicableVariantSizes: { type: array, items: { type: string } }
        outletIds: { type: array, items: { type: string } }
        combinable: { type: boolean, nullable: true }
        combinableWith: { type: array, items: { type: string } }
        activeFromHour: { type: string }
        activeToHour: { type: string }
        activeDays: { type: array, items: { type: integer } }
        isActive: { type: boolean }
        startDate: { type: string }
        endDate: { type: string }
        codeOnly:
          type: boolean
          description: When true, hidden from the POS panel; reachable only via a linked discount code.
        bxgyConfig:
          allOf: [{ $ref: '#/components/schemas/BXGYConfig' }]
          nullable: true
        tieredConfig:
          allOf: [{ $ref: '#/components/schemas/TieredConfig' }]
          nullable: true
        bundleConfig:
          allOf: [{ $ref: '#/components/schemas/BundleConfig' }]
          nullable: true
    DiscountCodeInput:
      type: object
      required: [code, type, value, isActive]
      properties:
        code: { type: string }
        promotionId: { type: string }
        type: { type: string, enum: [percentage, fixed] }
        value: { type: number, format: double }
        minPurchase: { type: number, format: double, nullable: true }
        usageLimit: { type: integer, nullable: true }
        perCustomerLimit: { type: integer, nullable: true }
        customerId:
          type: string
          nullable: true
        isActive: { type: boolean }
        startDate: { type: string }
        endDate: { type: string }
        combinable: { type: boolean, nullable: true }
    DiscountCodeBatchInput:
      type: object
      required: [type, value, count]
      properties:
        count: { type: integer }
        prefix: { type: string }
        suffixLength: { type: integer }
        promotionId: { type: string }
        type: { type: string, enum: [percentage, fixed] }
        value: { type: number, format: double }
        minPurchase: { type: number, format: double, nullable: true }
        usageLimit: { type: integer, nullable: true }
        perCustomerLimit: { type: integer, nullable: true }
        isActive: { type: boolean }
        startDate: { type: string }
        endDate: { type: string }
        combinable: { type: boolean, nullable: true }
    ImportSummary:
      type: object
      required: [create, update, skip, error, warning, newCategories]
      properties:
        create: { type: integer }
        update: { type: integer }
        skip: { type: integer }
        error: { type: integer }
        warning: { type: integer }
        newCategories: { type: integer }
    CsvImportRequest:
      type: object
      required: [csv, dryRun]
      properties:
        csv: { type: string, description: 'raw CSV text (UTF-8)' }
        fileName: { type: string }
        dryRun: { type: boolean }
        fileSha256: { type: string, description: 'the preview hash; required when dryRun=false' }
        expectedSummary: { $ref: '#/components/schemas/ImportSummary' }
    ImportFileIssue:
      type: object
      required: [severity, code, message]
      properties:
        severity: { type: string, enum: [error, warning] }
        code: { type: string }
        message: { type: string }
        column: { type: string }
    ImportIssue:
      type: object
      required: [row, line, severity, code, message]
      properties:
        row: { type: integer }
        line: { type: integer }
        column: { type: string }
        severity: { type: string, enum: [error, warning] }
        code: { type: string }
        message: { type: string }
        value: { type: string }
    ImportRowResult:
      type: object
      required: [row, line, action, key]
      properties:
        row: { type: integer }
        line: { type: integer }
        action: { type: string, enum: [create, update, skip, error] }
        key: { type: string }
        reason: { type: string }
    ImportReport:
      type: object
      required: [kind, delimiter, fileSha256, totalRows, summary, fileIssues, issues, rows]
      properties:
        kind: { type: string, enum: [customers, products, ingredients] }
        delimiter: { type: string }
        fileSha256: { type: string }
        totalRows: { type: integer }
        summary: { $ref: '#/components/schemas/ImportSummary' }
        fileIssues: { type: array, items: { $ref: '#/components/schemas/ImportFileIssue' } }
        issues: { type: array, description: 'every error and warning, capped at 5000', items: { $ref: '#/components/schemas/ImportIssue' } }
        rows: { type: array, description: 'first 500 rows only (counts are exact)', items: { $ref: '#/components/schemas/ImportRowResult' } }
        runId: { type: string }
        appliedAt: { type: string }
    ImportReportResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/ImportReport' }
    ImportRejectedResponse:
      type: object
      required: [data, error]
      properties:
        data: { $ref: '#/components/schemas/ImportReport' }
