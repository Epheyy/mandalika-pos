    MovementSummaryRow:
      type: object
      required: [productId, productName, variantSize, sku, currentStock, goodsIn, sold, refunded, transferIn, transferOut, adjustmentCount, opnameDiff]
      properties:
        productId: { type: string, format: uuid }
        productName: { type: string }
        variantSize: { type: string }
        sku: { type: string }
        currentStock: { type: integer }
        goodsIn: { type: integer }
        sold: { type: integer }
        refunded: { type: integer }
        transferIn: { type: integer }
        transferOut: { type: integer }
        adjustmentCount: { type: integer }
        opnameDiff: { type: integer }
    MovementSummaryResponse:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/MovementSummaryRow' } }
        meta: { $ref: '#/components/schemas/Meta' }
    # --- Inventory controls (S0 contract): kartu stok, giveaway, approvals, scanner CSV, requisitions ---
    InventoryLocationType:
      type: string
      enum: [outlet, warehouse]
    InventoryReasonCode:
      type: string
      enum: [damaged, expired, lost, found, data_entry, tester_sample, count_variance, other]
      description: "Reason for a stock change. `other` requires free text."
    InventoryDocEvent:
      type: object
      required: [id, action, at]
      description: One append-only history event of an inventory document (count, adjustment request, requisition, outlet giveaway).
      properties:
        id: { type: integer, format: int64 }
        action: { type: string, enum: [created, updated, submitted, approved, rejected, cancelled, applied, imported, fulfilled, refulfilled] }
        actorId: { type: string, format: uuid }
        actorName: { type: string }
        note: { type: string }
        data: { type: object, additionalProperties: true, description: "Action specific details, e.g. transferId, fromQty/toQty, importRunId." }
        at: { type: string, format: date-time }
    StockMovementRow:
      type: object
      required: [id, seq, occurredAt, recordedAt, kind, locationType, locationId, productId, variantSize, qty, qtyBefore, qtyAfter, refType, flags, isGiveaway]
      description: One stock ledger movement (kartu stok line). The running balance is qtyAfter in seq order.
      properties:
        id: { type: string, format: uuid }
        seq: { type: integer, format: int64, description: "Order in which the movement was applied at the location; the balance chain is continuous in this order." }
        occurredAt: { type: string, format: date-time }
        recordedAt: { type: string, format: date-time }
        kind: { type: string, enum: [sale, refund, transfer_out, transfer_in, transfer_cancel, receipt, adjust, count, opening, write_off] }
        locationType: { $ref: '#/components/schemas/InventoryLocationType' }
        locationId: { type: string, format: uuid }
        locationName: { type: string }
        productId: { type: string, format: uuid }
        productName: { type: string }
        variantSize: { type: string }
        sku: { type: string }
        barcode: { type: string }
        qty: { type: integer, description: "Signed change; negative is keluar." }
        qtyBefore: { type: integer }
        qtyAfter: { type: integer, description: Saldo after this movement. }
        refType: { type: string }
        refId: { type: string, format: uuid }
        refNumber: { type: string }
        flags: { type: array, items: { type: string }, description: "Ledger flags; `shortage` marks a movement that took stock below zero." }
        isGiveaway: { type: boolean, description: "Derived: the movement is the per-sale giveaway item (ledger key giveaway:<order id>). Never sent to the ERP." }
        actorId: { type: string }
        actorName: { type: string }
        reasonCode: { $ref: '#/components/schemas/InventoryReasonCode' }
        reasonText: { type: string }
        approvedBy: { type: string }
        erpStatus: { type: string, description: "Status of the ERP outbox document that carries this movement, when there is one." }
    StockMovementSummary:
      type: object
      required: [opening, totalIn, totalOut, closing]
      properties:
        opening: { type: integer, description: "qtyBefore of the first in-range row, or the balance at the last earlier row when the range is empty." }
        totalIn: { type: integer }
        totalOut: { type: integer, description: Absolute outgoing quantity. }
        closing: { type: integer }
    StockMovementPage:
      type: object
      required: [data]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/StockMovementRow' } }
        nextCursor: { type: string, description: "Opaque keyset cursor; absent on the last page." }
        summary:
          $ref: '#/components/schemas/StockMovementSummary'
    MovementLedgerSummaryRow:
      type: object
      required: [productId, productName, variantSize, sku, opening, inByKind, outByKind, closing]
      properties:
        productId: { type: string, format: uuid }
        productName: { type: string }
        variantSize: { type: string }
        sku: { type: string }
        barcode: { type: string }
        opening: { type: integer }
        inByKind: { type: object, additionalProperties: { type: integer }, description: "Incoming quantity per movement kind." }
        outByKind: { type: object, additionalProperties: { type: integer }, description: "Outgoing (absolute) quantity per movement kind." }
        closing: { type: integer }
    MovementLedgerSummaryResponse:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/MovementLedgerSummaryRow' } }
        meta: { $ref: '#/components/schemas/Meta' }
    OutletGiveaway:
      type: object
      required: [outletId, configured, enabled]
      description: The per-sale giveaway item of an outlet. `configured` is false (and enabled false) when the outlet has no giveaway row.
      properties:
        outletId: { type: string, format: uuid }
        configured: { type: boolean }
        enabled: { type: boolean }
        productId: { type: string, format: uuid }
        variantSize: { type: string }
        productName: { type: string }
        sku: { type: string }
        erpMapped: { type: boolean, description: "The variant has an ERP slug and SKU." }
        valid: { type: boolean, description: "The variant still exists." }
        updatedBy: { type: string, format: uuid }
        updatedAt: { type: string, format: date-time }
    OutletGiveawayInput:
      type: object
      required: [productId, variantSize, enabled]
      properties:
        productId: { type: string, format: uuid }
        variantSize: { type: string }
        enabled: { type: boolean }
    OutletGiveawayResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/OutletGiveaway' }
    AdjustmentRequestStatus:
      type: string
