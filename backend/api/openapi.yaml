    AdjustmentRequestListResponse:
      type: object
      required: [data]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/AdjustmentRequest' } }
        meta: { $ref: '#/components/schemas/Meta' }
    InventoryApproveInput:
      type: object
      required: [pin]
      description: Approver step-up. The approver is the logged-in user, who re-enters their own receive PIN.
      properties:
        pin: { type: string, minLength: 4, maxLength: 8 }
        note: { type: string }
    InventoryRejectInput:
      type: object
      required: [note]
      properties:
        note: { type: string, minLength: 1 }
    InventoryCancelInput:
      type: object
      properties:
        note: { type: string }
    AdjustmentRequestApproveResult:
      type: object
      required: [request, appliedAdjustmentId, liveQtyBefore, delta]
      properties:
        request: { $ref: '#/components/schemas/AdjustmentRequest' }
        appliedAdjustmentId: { type: string, format: uuid }
        liveQtyBefore: { type: integer, description: Live quantity just before the delta was applied. }
        delta: { type: integer, description: "The requested delta (requestedNewQty minus qtyAtRequest) that was applied." }
    AdjustmentRequestApproveResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/AdjustmentRequestApproveResult' }
    ApprovalQueueItem:
      type: object
      required: [type, id, locationType, locationId, at, lines, netDelta]
      properties:
        type: { type: string, enum: [count, adjustment] }
        id: { type: string, format: uuid }
        number: { type: string, description: "Document number (adjustments) or name (counts)." }
        locationType: { $ref: '#/components/schemas/InventoryLocationType' }
        locationId: { type: string, format: uuid }
        locationName: { type: string }
        requestedBy: { type: string, format: uuid }
        requestedByName: { type: string }
        at: { type: string, format: date-time }
        lines: { type: integer }
        netDelta: { type: integer }
    ApprovalQueueResponse:
      type: object
      required: [data, pendingCount]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/ApprovalQueueItem' } }
        pendingCount: { type: integer, description: "Number of pending items the caller may see, for the nav badge." }
        meta: { $ref: '#/components/schemas/Meta' }
    InventoryConflictError:
      type: object
      description: >
        409 body. When inventoryApprovalRequired is on and the direct endpoint was used, data.code is
        approval_required (same machine-code convention as ImportConflictResponse). Other 409s (lock
        conflict, invalid state, idempotency key reuse) send `{error}` with `data` null (the shared error envelope writes it).
      required: [error]
      properties:
        error: { type: string }
        data:
          type: object
          nullable: true
          required: [code]
          properties:
            code: { type: string, enum: [approval_required] }
    StockCountSubmitLineInput:
      type: object
      required: [productId, variantSize]
      properties:
        productId: { type: string, format: uuid }
        variantSize: { type: string }
        reasonCode: { $ref: '#/components/schemas/InventoryReasonCode' }
        reasonText: { type: string }
    StockCountSubmitInput:
      type: object
      required: [reasonCode]
      properties:
        reasonCode: { $ref: '#/components/schemas/InventoryReasonCode' }
        reasonText: { type: string }
        lines: { type: array, items: { $ref: '#/components/schemas/StockCountSubmitLineInput' } }
    StockCountImportWarning:
      type: string
      enum: [unknown_code, ambiguous_sku, not_on_count, stock_moved_since_start, baseline_replaced, sku_narrowed]
    StockCountImportLineRef:
      type: object
      required: [productId, variantSize]
      properties:
        productId: { type: string, format: uuid }
        variantSize: { type: string }
        productName: { type: string }
        sku: { type: string }
    StockCountImportRow:
      type: object
      required: [row, code, counted, warnings]
      description: One scanned code after repeated scans of the same code were summed.
      properties:
        row: { type: integer }
        code: { type: string, description: The scanned barcode or SKU. }
        matchedLine: { $ref: '#/components/schemas/StockCountImportLineRef' }
        expected: { type: integer, description: "The line's count-start snapshot (frozenQty)." }
        counted: { type: integer }
        previous: { type: integer, description: "The counted value this upload overwrites, when the line was already counted." }
        difference: { type: integer, description: Counted minus expected. }
        warnings: { type: array, items: { $ref: '#/components/schemas/StockCountImportWarning' } }
    StockCountImportSummary:
      type: object
      description: >
        Counters of one count import. All are exact (not capped like rows). The commit's
        expectedSummary is this object from the preview; the server recomputes it and answers 409
        import_stale when any counter or the digest differs. The digest is a server-computed sha256 over
        every matched line's stored counted value, whether it carries a manual baseline, and whether stock
        moved since the count started, so a manual save or a new stock movement between preview and commit
        is stale even when the counters are equal.
      required: [matched, unknown, ambiguous, notOnCount, uncounted, changed, digest]
      properties:
        matched: { type: integer, description: "Distinct scanned codes matched to exactly one line of the count." }
        unknown: { type: integer, description: "Distinct scanned codes that match no barcode or SKU." }
        ambiguous: { type: integer, description: "Distinct scanned codes that match more than one SKU; nothing is stored for them." }
        notOnCount: { type: integer, description: "Distinct scanned codes that resolve to a SKU that is not a line of this count." }
        uncounted: { type: integer, description: "Count lines absent from the file and never counted; they stay uncounted." }
        changed: { type: integer, description: "Matched lines whose stored counted value this upload would change (a never-counted line counts as changed)." }
        digest: { type: string, description: "Server-computed sha256 of the matched lines' state (see above). Send the preview's value back unchanged." }
    StockCountImportRequest:
      type: object
      description: Same shape as CsvImportRequest, with the count-specific expectedSummary.
      required: [csv, dryRun]
      properties:
        csv: { type: string, description: 'raw CSV text (UTF-8)' }
        fileName: { type: string }
        dryRun: { type: boolean }
        fileSha256: { type: string, description: 'the preview hash; required when dryRun=false' }
        expectedSummary: { $ref: '#/components/schemas/StockCountImportSummary' }
    StockCountImportReport:
      type: object
      required: [kind, delimiter, fileSha256, totalRows, summary, fileIssues, issues, rows, uncounted]
      properties:
        kind: { type: string, enum: [stock_count] }
        delimiter: { type: string }
        fileSha256: { type: string }
        totalRows: { type: integer }
        summary: { $ref: '#/components/schemas/StockCountImportSummary' }
        fileIssues: { type: array, items: { $ref: '#/components/schemas/ImportFileIssue' } }
        issues: { type: array, description: 'every error and warning, capped at 5000', items: { $ref: '#/components/schemas/ImportIssue' } }
        rows: { type: array, description: 'first 500 rows only (counts are exact)', items: { $ref: '#/components/schemas/StockCountImportRow' } }
        uncounted: { type: array, description: Count lines absent from the file and never counted; they stay uncounted., items: { $ref: '#/components/schemas/StockCountImportLineRef' } }
        runId: { type: string }
        appliedAt: { type: string }
    StockCountImportReportResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/StockCountImportReport' }
    StockCountImportRejectedResponse:
      type: object
      required: [data, error]
      properties:
        data: { $ref: '#/components/schemas/StockCountImportReport' }
        error: { type: string }
    StockRequisitionStatus:
      type: string
      enum: [draft, submitted, approved, rejected, fulfilled, cancelled]
    StockRequisitionItem:
      type: object
      required: [id, productId, variantSize, requestedQty]
      properties:
        id: { type: string, format: uuid }
        productId: { type: string, format: uuid }
        productName: { type: string }
        variantSize: { type: string }
        sku: { type: string }
        requestedQty: { type: integer, minimum: 1 }
        approvedQty: { type: integer, minimum: 0 }
        note: { type: string }
    StockRequisitionTransferLink:
      type: object
      required: [id, transferNo, status]
      properties:
        id: { type: string, format: uuid }
        transferNo: { type: string }
        status: { type: string, description: "Live status of the linked transfer." }
    StockRequisition:
      type: object
      required: [id, number, status, outletId, requestedBy, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        number: { type: string, description: "PB-YYYY-NNNNN" }
        status: { $ref: '#/components/schemas/StockRequisitionStatus' }
        outletId: { type: string, format: uuid }
        outletName: { type: string }
        warehouseId: { type: string, format: uuid, description: "Source gudang; set from approval." }
        warehouseName: { type: string }
        neededBy: { type: string, format: date }
        note: { type: string }
        requestedBy: { type: string, format: uuid }
        requestedByName: { type: string }
        submittedAt: { type: string, format: date-time }
        decidedBy: { type: string, format: uuid }
        decidedByName: { type: string }
        decidedAt: { type: string, format: date-time }
        decisionNote: { type: string }
        fulfilledBy: { type: string, format: uuid }
        fulfilledAt: { type: string, format: date-time }
        cancelledAt: { type: string, format: date-time }
        transfer: { $ref: '#/components/schemas/StockRequisitionTransferLink' }
        items: { type: array, description: Present on the detail read., items: { $ref: '#/components/schemas/StockRequisitionItem' } }
        events: { type: array, description: Present on the detail read., items: { $ref: '#/components/schemas/InventoryDocEvent' } }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    StockRequisitionItemInput:
      type: object
      required: [productId, variantSize, requestedQty]
      properties:
        productId: { type: string, format: uuid }
        variantSize: { type: string }
        requestedQty: { type: integer, minimum: 1 }
        note: { type: string }
    StockRequisitionInput:
      type: object
      required: [items]
      description: Create or replace a draft requisition. The outlet is the caller's active outlet (X-Outlet-Id for an admin).
      properties:
        note: { type: string }
        neededBy: { type: string, format: date }
        items: { type: array, items: { $ref: '#/components/schemas/StockRequisitionItemInput' } }
    StockRequisitionApproveItemInput:
      type: object
      required: [itemId, approvedQty]
      properties:
        itemId: { type: string, format: uuid }
        approvedQty: { type: integer, minimum: 0 }
    StockRequisitionApproveInput:
      type: object
      required: [warehouseId, items]
      properties:
        warehouseId: { type: string, format: uuid }
        items: { type: array, items: { $ref: '#/components/schemas/StockRequisitionApproveItemInput' } }
        note: { type: string }
    StockRequisitionFulfilResult:
      type: object
      required: [transferId, transferNo]
      properties:
        transferId: { type: string, format: uuid }
        transferNo: { type: string }
    StockRequisitionFulfilResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/StockRequisitionFulfilResult' }
    StockRequisitionResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/StockRequisition' }
    StockRequisitionListResponse:
      type: object
      required: [data]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/StockRequisition' } }
        meta: { $ref: '#/components/schemas/Meta' }
  responses:
    Unauthorized:
      description: unauthenticated
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: insufficient role/permission/outlet
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ImportReportOK:
      description: preview, applied result, or replay of an earlier commit
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ImportReportResponse' }
    ImportRejected:
      description: file or row errors; nothing was applied (the report says why)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ImportRejectedResponse' }
    ImportConflict:
      description: import_stale (data changed since the preview) or idempotency_conflict (same key, different file)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ImportConflictResponse' }
    NotFound:
      description: not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

paths:
  /healthz:
    get:
      operationId: health
      tags: [auth]
      security: []
      summary: Deep health (DB required; Redis reported, optional). Reserved by Cloud Run, use /livez there
      responses:
        '200': { description: 'ok, or degraded when only Redis is down or disabled' }
        '503': { description: database down }
  /livez:
    get:
      operationId: healthLivez
      tags: [auth]
      security: []
      summary: Same deep health as /healthz, at a path Cloud Run does not reserve
      responses:
        '200': { description: 'ok, or degraded when only Redis is down or disabled' }
        '503': { description: database down }
  /api/v1/auth/login:
    post:
      operationId: login
      tags: [auth]
      security: []
      summary: Email/password login → JWT access + refresh
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        '200':
          description: tokens + user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '400': { description: 'malformed body', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413': { description: 'request body over the 8 KiB cap', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '429': { description: rate limited }
  /api/v1/auth/refresh:
    post:
      operationId: refresh
      tags: [auth]
      security: []
      summary: Rotate refresh token, issue new access
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh]
              properties:
                refresh: { type: string }
      responses:
        '200':
          description: tokens + user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '400': { description: 'malformed body, or body over the 16 KiB cap', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/auth/logout:
    post:
      operationId: logout
      tags: [auth]
      security: []
      summary: Revoke refresh token
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh: { type: string }
      responses:
        '200': { description: ok }
        '400': { description: 'request body over the 16 KiB cap (a malformed body is ignored and still returns 200)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/v1/auth/me:
    get:
      operationId: me
      tags: [auth]
      summary: Current user
      responses:
        '200':
          description: current user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/auth/register:
    post:
      operationId: register
      tags: [users]
      summary: Admin-only user provisioning (no public signup)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateUserRequest' }
      responses:
        '201':
          description: created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List users (admin)
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: users
