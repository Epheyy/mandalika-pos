        '400': { description: invalid request }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/ImportConflict' }
        '413': { description: 'request body over the 20 MiB cap', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '429': { description: 'two imports already running in this process; retry shortly', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '503': { description: 'busy (lock conflict), nothing applied, retry', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { $ref: '#/components/responses/ImportRejected' }
  # --- ERP catalog (step 4) ---
  /api/v1/admin/erp/sku-mapping/export:
    get:
      operationId: exportSkuMapping
      tags: [imports]
      summary: One-time ERP SKU mapping sheet as CSV (admin only)
      description: >
        One row per product variant, ordered by product name then size, with columns
        variant_id, product, size, sku, has_stock, barcode, fg_code, fg_slug, erp_group_key.
        fg_code and fg_slug are prefilled only for variants already linked to the ERP;
        cells starting with = + - @ are guarded with a leading apostrophe. Read-only.
      responses:
        '200':
          description: CSV file (UTF-8, header row)
          content:
            text/csv:
              schema: { type: string }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/admin/erp/sku-mapping/import:
    post:
      operationId: importSkuMapping
      tags: [imports]
      summary: CSV ERP SKU mapping import, dry run or commit (admin only)
      description: >
        Sets sku = fg_code, erp_slug = fg_slug (and the product erp_group_key when given)
        for each row with both fg_code and fg_slug; rows with both empty are skipped.
        Barcode and size are never changed. Same dry run and commit contract as the
        product import; all-or-nothing.
      parameters:
        - $ref: '#/components/parameters/ImportIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CsvImportRequest' }
      responses:
        '200': { $ref: '#/components/responses/ImportReportOK' }
        '400': { description: invalid request }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/ImportConflict' }
        '413': { description: 'request body over the 20 MiB cap', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '429': { description: 'two imports already running in this process; retry shortly', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '503': { description: 'busy (lock conflict), nothing applied, retry', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { $ref: '#/components/responses/ImportRejected' }
  /api/v1/internal/erp/catalog-pull:
    post:
      operationId: erpCatalogPullScheduler
      tags: [imports]
      summary: ERP catalog pull trigger for Cloud Scheduler (X-Scheduler-Secret)
      description: >
        Machine-to-machine trigger, not for the backoffice. Authenticated by the shared secret
        in the X-Scheduler-Secret header (ERP_SCHEDULER_TOKEN, constant-time compare), not by a
        bearer token. Default mode when ?mode is absent: incremental. A failed, partial or
        skipped_locked run is still 200 (the outcome is in the body) so Cloud Scheduler does not
        retry-storm; a concurrent call returns skipped_locked. 503 when the token is unset or
        ERP_INTEGRATION_ENABLED is off.
      security:
        - schedulerSecret: []
      parameters:
        - { name: mode, in: query, schema: { type: string, enum: [full, incremental, auto] } }
      responses:
        '200':
          description: run report
          content: { application/json: { schema: { $ref: '#/components/schemas/ErpCatalogPullResponse' } } }
        '400': { description: unknown mode, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { description: missing or wrong X-Scheduler-Secret, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '429': { description: rate limit exceeded, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '500': { description: infrastructure failure before any resource ran, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '503': { description: scheduler endpoint disabled or ERP integration disabled, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/v1/admin/erp/catalog-pull:
    post:
      operationId: erpCatalogPullAdmin
      tags: [imports]
      summary: Run an ERP catalog pull now (admin only)
      description: >
        Same run as the scheduler route. Default mode when ?mode is absent: full. A failed or
        partial run is still 200 (the outcome is in the body); a concurrent call returns
        skipped_locked. 503 when ERP_INTEGRATION_ENABLED is off.
      parameters:
        - { name: mode, in: query, schema: { type: string, enum: [full, incremental, auto] } }
      responses:
        '200':
          description: run report
          content: { application/json: { schema: { $ref: '#/components/schemas/ErpCatalogPullResponse' } } }
        '400': { description: unknown mode, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { description: infrastructure failure before any resource ran, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '503': { description: ERP integration disabled, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
