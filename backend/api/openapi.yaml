openapi: 3.1.0
info:
  title: Mandalika POS API
  version: 0.2.0
  description: >
    Backend for Mandalika POS. Single contract — Go DTOs (oapi-codegen) and the
    TypeScript client (openapi-typescript) are generated from this file; CI fails
    on drift. Phase B exposes auth + read endpoints (outlet-scoped) + reports
    aggregation + users CRUD. Writes/order-tx/sync land in Phase C.
servers:
  - url: http://localhost:8080
security:
  - bearerAuth: []
tags:
  - name: auth
  - name: catalog
  - name: customers
  - name: promotions
  - name: sales
  - name: settings
  - name: users
  - name: reports

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    OutletHeader:
      name: X-Outlet-Id
      in: header
      required: false
      description: Active outlet override (admin only, or must match token outlet).
      schema: { type: string, format: uuid }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    OutletQuery:
      name: outletId
      in: query
      description: Admin-only explicit outlet scope; "all" for cross-outlet.
      schema: { type: string }
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
    Meta:
      type: object
      required: [total, page, limit]
      properties:
        total: { type: integer }
        page: { type: integer }
        limit: { type: integer }
    User:
      type: object
      required: [id, email, displayName, role, permissions, createdAt]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        displayName: { type: string }
        role: { type: string, enum: [admin, manager, cashier] }
        outletId: { type: string, format: uuid, nullable: true }
        photoURL: { type: string, nullable: true }
        permissions:
          type: array
          items: { type: string }
        createdAt: { type: string, format: date-time }
    AuthData:
      type: object
      required: [access, refresh, user]
      properties:
        access: { type: string }
        refresh: { type: string }
        user: { $ref: '#/components/schemas/User' }
    AuthResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/AuthData' }
    UserResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/User' }
    UserListResponse:
      type: object
      required: [data]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/User' } }
        meta: { $ref: '#/components/schemas/Meta' }
    CreateUserRequest:
      type: object
      required: [email, password, displayName, role]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password, minLength: 8 }
        displayName: { type: string }
        role: { type: string, enum: [admin, manager, cashier] }
        outletId: { type: string, format: uuid, nullable: true }
        permissions: { type: array, items: { type: string } }
    UpdateUserRequest:
      type: object
      properties:
        displayName: { type: string }
        role: { type: string, enum: [admin, manager, cashier] }
        outletId: { type: string, format: uuid, nullable: true }
        photoURL: { type: string, nullable: true }
        permissions: { type: array, items: { type: string } }
    Outlet:
      type: object
      required: [id, name, isActive, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        code: { type: string, nullable: true }
        address: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        logoUrl: { type: string, nullable: true }
        isActive: { type: boolean }
        createdAt: { type: string, format: date-time }
    OutletListResponse:
      type: object
      required: [data]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Outlet' } }
    Warehouse:
      type: object
      required: [id, name, isActive, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        code: { type: string, nullable: true }
        address: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        logoUrl: { type: string, nullable: true }
        isActive: { type: boolean }
        createdAt: { type: string, format: date-time }
    WarehouseInput:
      type: object
      required: [name, isActive]
      properties:
        name: { type: string }
        code: { type: string, nullable: true }
        address: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        logoUrl: { type: string, nullable: true }
        isActive: { type: boolean }
    WarehouseListResponse:
      type: object
      required: [data]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Warehouse' } }
    WarehouseStockRow:
      type: object
      required: [productId, productName, variantSize, stock]
      properties:
        productId: { type: string, format: uuid }
        productName: { type: string }
        variantSize: { type: string }
        sku: { type: string }
        stock: { type: integer }
        parLevel: { type: integer, nullable: true }
    WarehouseStockResponse:
      type: object
      required: [data]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/WarehouseStockRow' } }
    GoodsReceiptItemInput:
      type: object
      required: [productId, variantSize, qty]
      properties:
        productId: { type: string, format: uuid }
        variantSize: { type: string }
        qty: { type: integer }
        unitCost: { type: number, nullable: true }
    GoodsReceiptInput:
      type: object
      required: [items]
      properties:
        supplier: { type: string, nullable: true }
        note: { type: string, nullable: true }
        items: { type: array, items: { $ref: '#/components/schemas/GoodsReceiptItemInput' } }
    WarehouseAdjustInput:
      type: object
      required: [productId, variantSize, newQty, reason]
      properties:
        productId: { type: string, format: uuid }
        variantSize: { type: string }
        newQty: { type: integer }
        reason: { type: string }
    Ingredient:
      type: object
      required: [id, name, unit, sku, isActive, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        unit: { type: string }
        sku: { type: string }
        categoryId: { type: string, format: uuid, nullable: true }
        categoryName: { type: string, nullable: true }
        defaultUnitCost: { type: number, nullable: true }
        notes: { type: string, nullable: true }
        isActive: { type: boolean }
        createdAt: { type: string, format: date-time }
    IngredientInput:
      type: object
      required: [name, unit, isActive]
      properties:
        name: { type: string }
        unit: { type: string }
        sku: { type: string, nullable: true }
        categoryId: { type: string, format: uuid, nullable: true }
        defaultUnitCost: { type: number, nullable: true }
        notes: { type: string, nullable: true }
        isActive: { type: boolean }
    IngredientListResponse:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Ingredient' } }
        meta: { $ref: '#/components/schemas/Meta' }
    IngredientStockRow:
      type: object
      required: [ingredientId, name, unit, qty]
      properties:
        ingredientId: { type: string, format: uuid }
        name: { type: string }
        unit: { type: string }
        defaultUnitCost: { type: number, nullable: true }
        qty: { type: number }
    IngredientStockResponse:
      type: object
      required: [data]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/IngredientStockRow' } }
    RecipeIngredientLine:
      type: object
      required: [ingredientId, nameAtSave, name, qty, unitAtSave, isActive, onHandTotal]
      properties:
        ingredientId: { type: string, format: uuid }
        nameAtSave: { type: string }
        name: { type: string }
        qty: { type: number }
        unitAtSave: { type: string }
        costAtSave: { type: number, nullable: true }
        defaultUnitCost: { type: number, nullable: true }
        isActive: { type: boolean }
        onHandTotal: { type: number }
    Recipe:
      type: object
      required: [variantId, versionNo, versionCount, items]
      properties:
        variantId: { type: string, format: uuid }
        recipeId: { type: string, format: uuid, nullable: true }
        currentVersionId: { type: string, format: uuid, nullable: true }
        versionId: { type: string, format: uuid, nullable: true }
        versionNo: { type: integer }
        notes: { type: string, nullable: true }
        totalCostCached: { type: number, nullable: true }
        versionCount: { type: integer }
        items: { type: array, items: { $ref: '#/components/schemas/RecipeIngredientLine' } }
    RecipeResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/Recipe' }
    RecipeVersionSummary:
      type: object
      required: [id, versionNo, createdAt]
      properties:
        id: { type: string, format: uuid }
        versionNo: { type: integer }
        notes: { type: string, nullable: true }
        totalCostCached: { type: number, nullable: true }
        createdAt: { type: string, format: date-time }
        createdByName: { type: string, nullable: true }
    RecipeVersionListResponse:
      type: object
      required: [data]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/RecipeVersionSummary' } }
    RecipeVariantIdsResponse:
      type: object
      required: [variantIds]
      properties:
        variantIds:
          type: array
          items: { type: string }
    RecipeSaveItem:
      type: object
      required: [ingredientId, qty, sortOrder]
      properties:
        ingredientId: { type: string, format: uuid }
        qty: { type: number }
        sortOrder: { type: integer }
    RecipeSaveInput:
      type: object
      required: [items]
      properties:
        expectedCurrentVersionId: { type: string, format: uuid, nullable: true }
        notes: { type: string, nullable: true }
        items: { type: array, items: { $ref: '#/components/schemas/RecipeSaveItem' } }
    RecipeRestoreInput:
      type: object
      properties:
        expectedCurrentVersionId: { type: string, format: uuid, nullable: true }
    IngredientCategory:
      type: object
      required: [id, name, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        sortOrder: { type: integer, nullable: true }
        createdAt: { type: string, format: date-time }
    IngredientCategoryInput:
      type: object
      required: [name]
      properties:
        name: { type: string }
        sortOrder: { type: integer, nullable: true }
    IngredientCategoryListResponse:
      type: object
      required: [data]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/IngredientCategory' } }
    Tag:
      type: object
      required: [id, name, color, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        color: { type: string }
        sortOrder: { type: integer, nullable: true }
        createdAt: { type: string, format: date-time }
    TagInput:
      type: object
      required: [name, color]
      properties:
        name: { type: string }
        color: { type: string }
        sortOrder: { type: integer, nullable: true }
    TagListResponse:
      type: object
      required: [data]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Tag' } }
    SetCustomerTagsInput:
      type: object
      required: [tagIds]
      properties:
        tagIds: { type: array, items: { type: string } }
    Segment:
      type: object
      required: [id, name, color, sortOrder, isActive, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        color: { type: string }
        sortOrder: { type: integer }
        rMin: { type: integer, nullable: true }
        rMax: { type: integer, nullable: true }
        fMin: { type: integer, nullable: true }
        fMax: { type: integer, nullable: true }
        mMin: { type: number, nullable: true }
        mMax: { type: number, nullable: true }
        isActive: { type: boolean }
        createdAt: { type: string, format: date-time }
    SegmentInput:
      type: object
      required: [name, color]
      properties:
        name: { type: string }
        color: { type: string }
        rMin: { type: integer, nullable: true }
        rMax: { type: integer, nullable: true }
        fMin: { type: integer, nullable: true }
        fMax: { type: integer, nullable: true }
        mMin: { type: number, nullable: true }
        mMax: { type: number, nullable: true }
        isActive: { type: boolean, nullable: true }
    SegmentListResponse:
      type: object
      required: [data]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Segment' } }
    ReorderSegmentsInput:
      type: object
      required: [orderedIds]
      properties:
        orderedIds: { type: array, items: { type: string } }
    CustomerSegment:
      type: object
      required: [id, name, color]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        color: { type: string }
    IngredientUsageVariant:
      type: object
      required: [productName, variantSize]
      properties:
        productName: { type: string }
        variantSize: { type: string }
    IngredientUsageResponse:
      type: object
      required: [variants]
      properties:
        variants:
          type: array
          items: { $ref: '#/components/schemas/IngredientUsageVariant' }
    IngredientGoodsReceiptItemInput:
      type: object
      required: [ingredientId, qty]
      properties:
        ingredientId: { type: string, format: uuid }
        qty: { type: number }
        unitCost: { type: number, nullable: true }
    IngredientGoodsReceiptInput:
      type: object
      required: [items]
      properties:
        supplier: { type: string, nullable: true }
        note: { type: string, nullable: true }
        items: { type: array, items: { $ref: '#/components/schemas/IngredientGoodsReceiptItemInput' } }
    IngredientAdjustInput:
      type: object
      required: [ingredientId, newQty, reason]
      properties:
        ingredientId: { type: string, format: uuid }
        newQty: { type: number }
        reason: { type: string }
    IngredientTransferItem:
      type: object
      required: [id, ingredientId, ingredientName, ingredientUnit, sentQty]
      properties:
        id: { type: string, format: uuid }
        ingredientId: { type: string, format: uuid }
        ingredientName: { type: string }
        ingredientUnit: { type: string }
        sentQty: { type: number }
        receivedQty: { type: number, nullable: true }
        difference: { type: number, nullable: true }
    IngredientTransfer:
      type: object
      required: [id, transferNo, status, source, dest, createdAt, items]
      properties:
        id: { type: string, format: uuid }
        transferNo: { type: string }
        status: { type: string, enum: [draft, in_transit, completed, cancelled] }
        source: { $ref: '#/components/schemas/TransferLocation' }
        dest: { $ref: '#/components/schemas/TransferLocation' }
        suratJalanNo: { type: string, nullable: true }
        tandaTerimaNo: { type: string, nullable: true }
        note: { type: string, nullable: true }
        discrepancyReason: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        sentAt: { type: string, format: date-time, nullable: true }
        receivedAt: { type: string, format: date-time, nullable: true }
        cancelledAt: { type: string, format: date-time, nullable: true }
        cancelReason: { type: string, nullable: true }
        senderLetterhead: { $ref: '#/components/schemas/Letterhead', nullable: true }
        receiverLetterhead: { $ref: '#/components/schemas/Letterhead', nullable: true }
        items: { type: array, items: { $ref: '#/components/schemas/IngredientTransferItem' } }
    IngredientTransferListResponse:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/IngredientTransfer' } }
        meta: { $ref: '#/components/schemas/Meta' }
    IngredientTransferResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/IngredientTransfer' }
    IngredientTransferItemInput:
      type: object
      required: [ingredientId, qty]
      properties:
        ingredientId: { type: string, format: uuid }
        qty: { type: number }
    IngredientTransferCreateInput:
      type: object
      required: [source, dest, items]
      properties:
        source: { $ref: '#/components/schemas/TransferLocationInput' }
        dest: { $ref: '#/components/schemas/TransferLocationInput' }
        note: { type: string, nullable: true }
        items: { type: array, items: { $ref: '#/components/schemas/IngredientTransferItemInput' } }
    IngredientTransferReceiveItemInput:
      type: object
      required: [itemId, receivedQty]
      properties:
        itemId: { type: string, format: uuid }
        receivedQty: { type: number }
    IngredientTransferReceiveInput:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/IngredientTransferReceiveItemInput' } }
        discrepancyReason: { type: string, nullable: true }
    IngredientTransferCancelInput:
      type: object
      required: [reason]
      properties:
        reason: { type: string }
    IngredientStockCountItem:
      type: object
      required: [id, ingredientId, ingredientName, ingredientUnit]
      properties:
        id: { type: string, format: uuid }
        ingredientId: { type: string, format: uuid }
        ingredientName: { type: string }
        ingredientUnit: { type: string }
        counted: { type: number, nullable: true }
        difference: { type: number, nullable: true }
    IngredientStockCount:
      type: object
      required: [id, name, status, location, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        status: { type: string, enum: [planned, in_progress, completed, cancelled] }
        location: { $ref: '#/components/schemas/TransferLocation' }
        plannedDate: { type: string, format: date, nullable: true }
        notes: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        startedAt: { type: string, format: date-time, nullable: true }
        completedAt: { type: string, format: date-time, nullable: true }
        items: { type: array, items: { $ref: '#/components/schemas/IngredientStockCountItem' } }
    IngredientStockCountInput:
      type: object
      required: [name, location]
      properties:
        name: { type: string }
        location: { $ref: '#/components/schemas/TransferLocationInput' }
        plannedDate: { type: string, format: date, nullable: true }
        notes: { type: string, nullable: true }
    IngredientStockCountSaveItemInput:
      type: object
      required: [itemId, counted]
      properties:
        itemId: { type: string, format: uuid }
        counted: { type: number }
    IngredientStockCountSaveInput:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/IngredientStockCountSaveItemInput' } }
    IngredientStockCountListResponse:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/IngredientStockCount' } }
        meta: { $ref: '#/components/schemas/Meta' }
    IngredientStockCountResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/IngredientStockCount' }
    TransferLocation:
      type: object
      required: [kind, id]
      properties:
        kind: { type: string, enum: [outlet, warehouse] }
        id: { type: string, format: uuid }
        name: { type: string }
    Letterhead:
      type: object
      required: [locationName, addressLines]
      properties:
        locationName: { type: string }
        brandName:    { type: string, nullable: true }
        logoUrl:      { type: string, nullable: true }
        addressLines:
          type: array
          items: { type: string }
        phone:        { type: string, nullable: true }
        npwp:         { type: string, nullable: true }
    TransferLocationInput:
      type: object
      required: [kind, id]
      properties:
        kind: { type: string, enum: [outlet, warehouse] }
        id: { type: string, format: uuid }
    TransferItem:
      type: object
      required: [productId, productName, variantSize, sentQty]
      properties:
        productId: { type: string, format: uuid }
        productName: { type: string }
        variantSize: { type: string }
        sku: { type: string }
        sentQty: { type: integer }
        receivedQty: { type: integer, nullable: true }
        difference: { type: integer, nullable: true }
    Transfer:
      type: object
      required: [id, transferNo, status, source, dest, createdAt, items]
      properties:
        id: { type: string, format: uuid }
        transferNo: { type: string }
        status: { type: string, enum: [draft, in_transit, completed, cancelled] }
        source: { $ref: '#/components/schemas/TransferLocation' }
        dest: { $ref: '#/components/schemas/TransferLocation' }
        note: { type: string, nullable: true }
        discrepancyReason: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        sentAt: { type: string, format: date-time, nullable: true }
        receivedAt: { type: string, format: date-time, nullable: true }
        cancelledAt: { type: string, format: date-time, nullable: true }
        items: { type: array, items: { $ref: '#/components/schemas/TransferItem' } }
        suratJalanNo:       { type: string, nullable: true }
        tandaTerimaNo:      { type: string, nullable: true }
        senderLetterhead:   { $ref: '#/components/schemas/Letterhead', nullable: true }
        receiverLetterhead: { $ref: '#/components/schemas/Letterhead', nullable: true }
    TransferListResponse:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Transfer' } }
        meta: { $ref: '#/components/schemas/Meta' }
    TransferResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/Transfer' }
    TransferItemInput:
      type: object
      required: [productId, variantSize, qty]
      properties:
        productId: { type: string, format: uuid }
        variantSize: { type: string }
        qty: { type: integer }
    TransferCreateInput:
      type: object
      required: [source, dest, items]
      properties:
        source: { $ref: '#/components/schemas/TransferLocationInput' }
        dest: { $ref: '#/components/schemas/TransferLocationInput' }
        note: { type: string, nullable: true }
        items: { type: array, items: { $ref: '#/components/schemas/TransferItemInput' } }
    TransferReceiveItemInput:
      type: object
      required: [productId, variantSize, receivedQty]
      properties:
        productId: { type: string, format: uuid }
        variantSize: { type: string }
        receivedQty: { type: integer }
    TransferReceiveInput:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/TransferReceiveItemInput' } }
        discrepancyReason: { type: string, nullable: true }
    Category:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string, nullable: true }
        sortOrder: { type: integer, nullable: true }
    CategoryListResponse:
      type: object
      required: [data]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Category' } }
    ProductVariant:
      type: object
      required: [size, price, stock, sku]
      properties:
        id: { type: string, format: uuid, nullable: true }
        size: { type: string }
        price: { type: number }
        stock: { type: integer }
        sku: { type: string }
        barcode: { type: string }
        parLevel: { type: integer, nullable: true }
    Product:
      type: object
