  /api/v1/orders:
    post:
      operationId: createOrder
      tags: [sales]
      summary: >
        Checkout in one Postgres tx — server computes money/stock/loyalty,
        idempotent on the Idempotency-Key header (plan §5, §9).
      parameters:
        - $ref: '#/components/parameters/OutletHeader'
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateOrderRequest' }
      responses:
        '201':
          description: canonical stored order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderResponse' }
        '400': { description: invalid order }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422':
          description: discount or tender rejected (online only; cash shortfall or invalid discount)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    get:
      operationId: listOrders
      tags: [sales]
      summary: List orders (outlet-scoped, paginated)
      parameters:
        - $ref: '#/components/parameters/OutletHeader'
        - $ref: '#/components/parameters/OutletQuery'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: shiftId
          in: query
          schema: { type: string, format: uuid }
        - name: customerId
          in: query
          schema: { type: string, format: uuid }
        - name: from
          in: query
          description: Legacy (POS) lower bound, a YYYY-MM-DD read as a UTC day. Meaning unchanged; prefer dateFrom.
          schema: { type: string }
        - name: to
          in: query
          description: Legacy (POS) inclusive upper day (YYYY-MM-DD, UTC day). Meaning unchanged; prefer dateTo.
          schema: { type: string }
        - $ref: '#/components/parameters/WIBDateFrom'
        - $ref: '#/components/parameters/WIBDateTo'
        - $ref: '#/components/parameters/OrderStatusFilter'
        - $ref: '#/components/parameters/OrderDateBasis'
        - $ref: '#/components/parameters/OrderPaymentMethodFilter'
        - $ref: '#/components/parameters/OrderSearch'
      responses:
        '200':
          description: orders
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderListResponse' }
        '400': { description: invalid date or status filter }
