  # --- ERP outbox (plan step 5) ---
  /api/v1/internal/erp/relay:
    post:
      operationId: runErpRelayScheduled
      tags: [admin]
      summary: Run one ERP outbox relay pass (Cloud Scheduler; shared-secret header, no JWT)
      security:
        - schedulerSecret: []
      responses:
        '200':
          description: relay report (disabled=true when the relay is off)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErpRelayReportResponse' }
        '401':
          description: missing or wrong scheduler secret
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429':
          description: rate limited (30 requests per minute)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: scheduler secret not configured
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/v1/admin/erp/relay:
    post:
      operationId: runErpRelay
      tags: [admin]
      summary: Run one ERP outbox relay pass now (admin)
      responses:
        '200':
          description: relay report (disabled=true when the relay is off)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErpRelayReportResponse' }
  /api/v1/admin/erp/outbox:
    get:
      operationId: listErpOutbox
