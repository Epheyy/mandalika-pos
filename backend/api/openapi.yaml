          required: [code]
          properties:
            code: { type: string, enum: [import_stale, idempotency_conflict] }
    OutletInput:
      type: object
      required: [name, isActive]
      properties:
        name: { type: string }
        code: { type: string }
        address: { type: string }
        phone: { type: string }
        logoUrl: { type: string, nullable: true }
        isActive: { type: boolean }
        timezone:
          type: string
          enum: [Asia/Jakarta, Asia/Makassar, Asia/Jayapura]
          description: Optional. Absent keeps the current zone (new outlets default to Asia/Jakarta). Changing it never rewrites the business date of existing sales.
    ReceiveApprover:
      type: object
      required: [userId, displayName]
      properties:
        userId: { type: string, format: uuid }
        displayName: { type: string }
    ReceiveApproverListResponse:
      type: object
      required: [data]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/ReceiveApprover' } }
    TransferReceiveApprovalItem:
      type: object
      required: [productId, variantSize, receivedQty]
      properties:
