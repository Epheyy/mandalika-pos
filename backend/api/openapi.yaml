        '404':
          description: not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: row is pending or sending
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  # --- end ERP outbox ---
  # --- Inventory controls (S0 contract; the handlers land in S1-S5) ---
  /api/v1/inventory/movements:
    get:
      operationId: listStockMovements
      tags: [catalog]
      summary: Kartu stok. Ledger movements of one location, optionally one SKU, newest first by seq (manage_inventory)
      description: >
        Reads the append-only stock ledger. The saldo is qtyAfter in seq order; occurredAt is shown
        but never used for ordering. from/to filter occurredAt (RFC 3339, or a date read in the
        outlet timezone). `summary` is returned only when one SKU (productId and variantSize) is filtered.
      parameters:
        - { name: locationType, in: query, required: true, schema: { $ref: '#/components/schemas/InventoryLocationType' } }
        - { name: locationId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: productId, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: variantSize, in: query, required: false, schema: { type: string } }
        - name: kind
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: array
            items: { type: string, enum: [sale, refund, transfer_out, transfer_in, transfer_cancel, receipt, adjust, count, opening, write_off] }
        - { name: flag, in: query, required: false, schema: { type: string, enum: [shortage] } }
        - { name: giveaway, in: query, required: false, description: "true returns only giveaway movements (derived from the ledger key), false excludes giveaway movements, absent returns all.", schema: { type: boolean } }
        - { name: from, in: query, required: false, schema: { type: string } }
        - { name: to, in: query, required: false, schema: { type: string } }
        - { name: cursor, in: query, required: false, description: "Opaque; the nextCursor of the previous page.", schema: { type: string } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        '200':
          description: movements
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StockMovementPage' }
        '400': { description: invalid filter, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/inventory/movements/export:
    get:
      operationId: exportStockMovements
      tags: [catalog]
      summary: Kartu stok as CSV, same filters as the list (manage_inventory)
      description: >
        UTF-8 CSV with a header row; cells starting with = + - @ are guarded. The range is at most 93 days
        and 100000 rows; a larger export answers 413.
      parameters:
        - { name: locationType, in: query, required: true, schema: { $ref: '#/components/schemas/InventoryLocationType' } }
        - { name: locationId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: productId, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: variantSize, in: query, required: false, schema: { type: string } }
        - name: kind
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: array
            items: { type: string, enum: [sale, refund, transfer_out, transfer_in, transfer_cancel, receipt, adjust, count, opening, write_off] }
        - { name: flag, in: query, required: false, schema: { type: string, enum: [shortage] } }
        - { name: giveaway, in: query, required: false, schema: { type: boolean } }
        - { name: from, in: query, required: false, schema: { type: string } }
        - { name: to, in: query, required: false, schema: { type: string } }
      responses:
        '200':
          description: CSV file (UTF-8, header row)
          content:
            text/csv:
              schema: { type: string }
        '400': { description: invalid filter, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413': { description: range over 93 days or over 100000 rows, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/v1/inventory/movements/summary:
    get:
      operationId: getMovementLedgerSummary
      tags: [catalog]
      summary: Per-SKU ledger summary of one location, with opening and closing saldo (manage_inventory)
      parameters:
        - { name: locationType, in: query, required: true, schema: { $ref: '#/components/schemas/InventoryLocationType' } }
        - { name: locationId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: from, in: query, required: false, schema: { type: string } }
        - { name: to, in: query, required: false, schema: { type: string } }
        - { name: q, in: query, required: false, description: "Substring match on product name, SKU or barcode.", schema: { type: string } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: ledger summary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MovementLedgerSummaryResponse' }
        '400': { description: invalid filter, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/outlets/{id}/giveaway:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getOutletGiveaway
      tags: [catalog]
      summary: The per-sale giveaway item of an outlet (manage_outlets)
      responses:
        '200':
          description: giveaway setting; configured false when the outlet has none
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OutletGiveawayResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: "outlet not found (an outlet with no giveaway setting returns 200 with configured false)", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    put:
      operationId: setOutletGiveaway
      tags: [catalog]
      summary: Set the per-sale giveaway item of an outlet (manage_outlets)
      parameters:
        - $ref: '#/components/parameters/RequiredWriteIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OutletGiveawayInput' }
      responses:
        '200':
          description: saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OutletGiveawayResponse' }
        '400': { description: invalid body, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: "the variant does not exist, the ERP integration is on and the variant has no ERP slug and SKU, or Idempotency-Key reused with a different request", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/v1/inventory/adjustment-requests:
    get:
      operationId: listAdjustmentRequests
      tags: [catalog]
      summary: List stock adjustment requests (manage_inventory)
      parameters:
        - { name: status, in: query, required: false, schema: { $ref: '#/components/schemas/AdjustmentRequestStatus' } }
        - { name: locationType, in: query, required: false, schema: { $ref: '#/components/schemas/InventoryLocationType' } }
        - { name: locationId, in: query, required: false, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: adjustment requests
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdjustmentRequestListResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createAdjustmentRequest
      tags: [catalog]
      summary: Request a stock adjustment to a new quantity; it waits for approval (manage_inventory)
      parameters:
        - $ref: '#/components/parameters/RequiredWriteIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdjustmentRequestCreateInput' }
      responses:
        '201':
          description: created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdjustmentRequestResponse' }
        '400': { description: invalid body, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: "Idempotency-Key reused with a different request, or a conflicting state", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/v1/inventory/adjustment-requests/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getAdjustmentRequest
      tags: [catalog]
      summary: Get one adjustment request with its history and the live quantity (manage_inventory)
      responses:
        '200':
          description: adjustment request
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdjustmentRequestResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/inventory/adjustment-requests/{id}/approve:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: approveAdjustmentRequest
      tags: [catalog]
      summary: Approve with the approver's PIN; applies the requested delta (manage_inventory and the approver rule)
      description: >
        The approver must be an admin or a receive approver role user, never the requester. The
        applied change is the requested delta (requestedNewQty minus qtyAtRequest), not the absolute value.
        The PIN is verified and the attempt/lockout counters are committed in their own transaction before the keyed effect runs (as mintReceiveApproval does, receive_approval.go:287-292), so a refused claim never rolls back a wrong-PIN attempt. `pin` is excluded from the idempotency fingerprint.
      parameters:
        - $ref: '#/components/parameters/RequiredWriteIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InventoryApproveInput' }
      responses:
        '200':
          description: approved and applied
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdjustmentRequestApproveResponse' }
        '400': { description: invalid body, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: "same body for an ineligible approver, no PIN set and a wrong PIN", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: "request is not pending, the approver is the requester, or Idempotency-Key reused with a different request", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '429':
          description: locked out after repeated wrong PINs; see Retry-After (seconds, absent on a hard lock) and the body
          headers:
            Retry-After: { schema: { type: integer } }
          content: { application/json: { schema: { $ref: '#/components/schemas/ReceiveApprovalLocked' } } }
        '503':
          description: lock wait timed out or the database is busy; nothing was verified, retry after Retry-After
          headers:
            Retry-After: { schema: { type: integer } }
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
  /api/v1/inventory/adjustment-requests/{id}/reject:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: rejectAdjustmentRequest
      tags: [catalog]
      summary: Reject a pending adjustment request with a note (manage_inventory)
      parameters:
        - $ref: '#/components/parameters/RequiredWriteIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InventoryRejectInput' }
      responses:
        '200':
          description: rejected
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdjustmentRequestResponse' }
        '400': { description: invalid body, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: "request is not pending, or Idempotency-Key reused with a different request", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/v1/inventory/adjustment-requests/{id}/cancel:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: cancelAdjustmentRequest
      tags: [catalog]
      summary: Cancel a pending adjustment request (the requester; manage_inventory)
      parameters:
        - $ref: '#/components/parameters/RequiredWriteIdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InventoryCancelInput' }
      responses:
        '200':
          description: cancelled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdjustmentRequestResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: "request is not pending, or Idempotency-Key reused with a different request", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/v1/inventory/approvals:
    get:
      operationId: listInventoryApprovals
      tags: [catalog]
      summary: Persetujuan Stok queue. Pending counts and adjustment requests in one list (manage_inventory or manage_stock_count)
      parameters:
        - { name: status, in: query, required: false, schema: { type: string, enum: [pending], default: pending } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: pending approvals and the pending count
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApprovalQueueResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/stock-counts/{id}/submit:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: submitStockCount
      tags: [sales]
      summary: Submit a finished count for approval; status becomes pending_approval (manage_stock_count)
      parameters:
        - $ref: '#/components/parameters/OutletHeader'
        - $ref: '#/components/parameters/RequiredWriteIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StockCountSubmitInput' }
      responses:
        '200':
          description: submitted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StockCountResponse' }
        '400': { description: invalid body, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: "count is not in progress, lock conflict (retryable), or Idempotency-Key reused with a different request", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/v1/stock-counts/{id}/approve:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: approveStockCount
      tags: [sales]
      summary: Approve a submitted count with the approver's PIN; applies the deltas (manage_stock_count and the approver rule)
      description: >
        The PIN is verified and the attempt/lockout counters are committed in their own transaction before the keyed effect runs (as mintReceiveApproval does, receive_approval.go:287-292), so a refused claim never rolls back a wrong-PIN attempt. `pin` is excluded from the idempotency fingerprint.
      parameters:
        - $ref: '#/components/parameters/OutletHeader'
        - $ref: '#/components/parameters/RequiredWriteIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InventoryApproveInput' }
      responses:
        '200':
          description: approved and applied
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StockCountResponse' }
        '400': { description: invalid body, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: "same body for an ineligible approver, no PIN set and a wrong PIN", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: "count is not pending approval, the approver is the submitter, lock conflict (retryable), or Idempotency-Key reused with a different request", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '429':
          description: locked out after repeated wrong PINs; see Retry-After (seconds, absent on a hard lock) and the body
          headers:
            Retry-After: { schema: { type: integer } }
          content: { application/json: { schema: { $ref: '#/components/schemas/ReceiveApprovalLocked' } } }
        '503':
          description: lock wait timed out or the database is busy; nothing was verified, retry after Retry-After
          headers:
            Retry-After: { schema: { type: integer } }
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
  /api/v1/stock-counts/{id}/reject:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: rejectStockCount
      tags: [sales]
      summary: Reject a submitted count with a note; it returns to in_progress for a recount (manage_stock_count and the approver rule)
      parameters:
        - $ref: '#/components/parameters/OutletHeader'
        - $ref: '#/components/parameters/RequiredWriteIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InventoryRejectInput' }
      responses:
        '200':
          description: rejected, back in progress
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StockCountResponse' }
        '400': { description: invalid body, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: "count is not pending approval, or Idempotency-Key reused with a different request", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/v1/stock-counts/{id}/export:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: exportStockCount
      tags: [sales]
      summary: Count sheet as CSV for a scanner app (manage_stock_count)
      description: >
        Columns sku, barcode, product, size, expected_qty and an empty counted_qty, with a UTF-8 BOM. Cells starting
        with = + - @ are guarded with a leading apostrophe. Read-only.
      parameters:
        - $ref: '#/components/parameters/OutletHeader'
      responses:
        '200':
          description: CSV file (UTF-8, header row)
          content:
            text/csv:
              schema: { type: string }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: count is not in progress, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/v1/stock-counts/{id}/import:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: importStockCount
      tags: [imports]
      summary: Scanner CSV upload for an in-progress count, dry run or commit (manage_stock_count)
      description: >
        Rows are barcode or sku plus counted_qty; repeated scans of one code are summed. The dry run
        returns the diff preview and writes nothing. A commit stores the counted quantities only (it
        never changes stock) and needs fileSha256 and expectedSummary from the preview and an
        Idempotency-Key. Same dry run and commit contract as the product import.
      parameters:
        - $ref: '#/components/parameters/OutletHeader'
        - $ref: '#/components/parameters/ImportIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StockCountImportRequest' }
      responses:
        '200':
          description: preview, applied result, or replay of an earlier commit
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StockCountImportReportResponse' }
        '400': { description: invalid request }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/ImportConflict' }
        '413': { description: 'request body over the 20 MiB cap', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422':
          description: file or row errors; nothing was applied (the report says why)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StockCountImportRejectedResponse' }
        '429': { description: 'two imports already running in this process; retry shortly', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '503': { description: 'busy (lock conflict), nothing applied, retry', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/v1/requisitions:
    get:
      operationId: listRequisitions
      tags: [sales]
      summary: List Permintaan Barang (request_stock for the own outlet, or manage_inventory)
      parameters:
        - $ref: '#/components/parameters/OutletHeader'
        - { name: status, in: query, required: false, schema: { $ref: '#/components/schemas/StockRequisitionStatus' } }
        - { name: outletId, in: query, required: false, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: requisitions
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StockRequisitionListResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createRequisition
      tags: [sales]
      summary: Create a draft Permintaan Barang for the active outlet (request_stock)
      description: >
        The outlet comes from the authenticated scope (token outlet, or X-Outlet-Id for an admin),
        never from a body or query field. 400 when the request resolves to no single outlet
        (an admin without X-Outlet-Id).
      parameters:
        - $ref: '#/components/parameters/OutletHeader'
        - $ref: '#/components/parameters/RequiredWriteIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StockRequisitionInput' }
      responses:
        '201':
          description: created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StockRequisitionResponse' }
        '400': { description: "invalid body, or no active outlet (the request resolves to no single outlet)", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: "Idempotency-Key reused with a different request", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/v1/requisitions/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getRequisition
      tags: [sales]
      summary: Get a Permintaan Barang with items, history and the linked transfer (request_stock for the own outlet, or manage_inventory)
      parameters:
        - $ref: '#/components/parameters/OutletHeader'
      responses:
        '200':
          description: requisition
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StockRequisitionResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: updateRequisition
      tags: [sales]
      summary: Replace a draft Permintaan Barang (request_stock; drafts only)
      description: >
        The outlet comes from the authenticated scope, never from a body or query field; the draft
        must belong to it. 400 when the request resolves to no single outlet (an admin without X-Outlet-Id).
      parameters:
        - $ref: '#/components/parameters/OutletHeader'
        - $ref: '#/components/parameters/RequiredWriteIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StockRequisitionInput' }
      responses:
        '200':
          description: updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StockRequisitionResponse' }
        '400': { description: "invalid body, or no active outlet (the request resolves to no single outlet)", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: "requisition is not a draft, or Idempotency-Key reused with a different request", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/v1/requisitions/{id}/submit:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: submitRequisition
      tags: [sales]
      summary: Submit a draft Permintaan Barang to the warehouse (request_stock)
      parameters:
        - $ref: '#/components/parameters/OutletHeader'
        - $ref: '#/components/parameters/RequiredWriteIdempotencyKey'
      responses:
        '200':
          description: submitted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StockRequisitionResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: "requisition is not a draft, it has no lines, or Idempotency-Key reused with a different request", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/v1/requisitions/{id}/cancel:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: cancelRequisition
      tags: [sales]
      summary: Cancel a draft or submitted Permintaan Barang (request_stock)
      parameters:
        - $ref: '#/components/parameters/OutletHeader'
        - $ref: '#/components/parameters/RequiredWriteIdempotencyKey'
      responses:
        '200':
          description: cancelled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StockRequisitionResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: "requisition is already decided, or Idempotency-Key reused with a different request", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/v1/requisitions/{id}/approve:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: approveRequisition
      tags: [sales]
      summary: Approve a submitted Permintaan Barang with per-line approved quantities and a source gudang (manage_inventory)
      parameters:
        - $ref: '#/components/parameters/RequiredWriteIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StockRequisitionApproveInput' }
      responses:
        '200':
          description: approved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StockRequisitionResponse' }
        '400': { description: invalid body, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: "requisition is not submitted, or Idempotency-Key reused with a different request", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/v1/requisitions/{id}/reject:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: rejectRequisition
      tags: [sales]
      summary: Reject a submitted Permintaan Barang with a note (manage_inventory)
      parameters:
        - $ref: '#/components/parameters/RequiredWriteIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InventoryRejectInput' }
      responses:
        '200':
          description: rejected
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StockRequisitionResponse' }
        '400': { description: invalid body, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: "requisition is not submitted, or Idempotency-Key reused with a different request", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/v1/requisitions/{id}/fulfil:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: fulfilRequisition
      tags: [sales]
      summary: Create the gudang to toko transfer draft for an approved Permintaan Barang (manage_inventory)
      description: Allowed again only when the linked transfer is cancelled; the requisition then gets a new link.
      parameters:
        - $ref: '#/components/parameters/RequiredWriteIdempotencyKey'
      responses:
        '201':
          description: transfer draft created and linked
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StockRequisitionFulfilResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: "requisition is not approved, a non-cancelled transfer is already linked, or Idempotency-Key reused with a different request", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
