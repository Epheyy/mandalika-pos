# Fly.io deployment for the Mandalika POS backend.
# Default host (low budget, single region, managed TLS, built-in secret store).
# Region sin = Singapore — closest Fly region to Lombok/Indonesia.
#
# One-time:   fly launch --no-deploy --copy-config --name mandalika-pos
# Secrets:    see RUNBOOK.md "Secrets"  (fly secrets set ...)
# Deploy:     fly deploy
# Custom TLS: fly certs add api.<your-domain>   (Fly provisions Let's Encrypt)

app = "mandalika-pos"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  ENV = "production"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

  # Liveness only — must not touch DB/Redis, so a transient dependency
  # blip does not cycle the machine. Deep health is GET /livez (also /healthz off Cloud Run).
  [[http_service.checks]]
    method = "get"
    path = "/readyz"
    interval = "15s"
    timeout = "3s"
    grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
