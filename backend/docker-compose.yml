services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mandalika
      POSTGRES_PASSWORD: mandalika
      POSTGRES_DB: mandalika_pos
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mandalika -d mandalika_pos"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
