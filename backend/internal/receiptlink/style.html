{{define "style"}}<style>
:root{
--color-paper-0:#fbf9f5;--color-paper-1:#f3efe7;--color-paper-2:#e9e3d8;
--color-ink-900:#1a1008;--color-ink-700:#4a3f33;--color-ink-500:#7a6f62;
--color-brand:#b07d18;--color-brand-strong:#8f6412;--color-brand-strong-hover:#7a550f;--color-on-brand:#ffffff;
--color-ok:#1f7a4d;--color-ok-bg:#e3f3ea;--color-danger:#b42318;--color-danger-bg:#fbe4e1;
--color-warn-strong:#a14a06;--color-warn-bg:#fdf0df;
--color-gold-50:#fdf8ee;--color-gray-300:#d7cfc0;
--radius-control:12px;--radius-sheet:16px;--radius-panel:24px;--radius-tag:6px;
--text-caption:12px;--text-secondary:13px;--text-button:14px;--text-body:15px;--text-bar:20px;--text-amount:26px;
--font-sans:'Roboto Variable', Roboto, system-ui, -apple-system, 'Segoe UI', sans-serif;
--surface-solid-bg:#fffdf9;--surface-border:rgba(255, 255, 255, 0.7);
--surface-shadow:inset 0 1px 0 rgba(255, 255, 255, 0.85), 0 0 0 0.5px rgba(26, 16, 8, 0.08), 0 14px 36px -14px rgba(70, 46, 10, 0.28);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--color-paper-0)}
body{margin:0;min-height:100vh;color:var(--color-ink-900);font:400 var(--text-body)/1.5 var(--font-sans);
background:var(--color-paper-0);
background-image:radial-gradient(520px 420px at 6% 2%, rgba(214, 162, 58, 0.3), transparent 70%),
radial-gradient(560px 460px at 70% 14%, rgba(236, 176, 124, 0.24), transparent 70%),
radial-gradient(700px 520px at 36% 104%, rgba(176, 125, 24, 0.18), transparent 70%);
background-repeat:no-repeat}
.wrap{max-width:30rem;margin:0 auto;padding:1.75rem 1rem 2.5rem}
.mast{text-align:center;padding:.5rem 0 0}
.cut{height:0;border:0;border-top:1.5px dashed var(--color-paper-2);margin:1.1rem -1.25rem 1.1rem}
.logo{display:block;margin:0 auto .75rem;max-height:56px;max-width:180px;width:auto;height:auto}
.brand{margin:0;font-size:var(--text-bar);line-height:1.2;font-weight:900;letter-spacing:.01em}
.hello{margin:.35rem 0 0;color:var(--color-ink-700);font-size:var(--text-body)}
.panel{background:var(--surface-solid-bg);border:1px solid var(--surface-border);box-shadow:var(--surface-shadow);
border-radius:var(--radius-panel);padding:1.25rem;margin:0 0 1rem}
h2{margin:0 0 .75rem;font-size:17px;line-height:1.3;font-weight:800}
.rate h2{font-size:var(--text-bar);font-weight:900}
.meta{display:grid;grid-template-columns:auto 1fr;gap:.2rem .75rem;margin:0 0 1rem;font-size:var(--text-secondary)}
.meta dt{color:var(--color-ink-500)}
.meta dd{margin:0;text-align:right;font-weight:600;color:var(--color-ink-900);overflow-wrap:anywhere}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
td{padding:.5rem 0;vertical-align:top}
tbody tr.line td{border-top:1px solid var(--color-paper-2)}
td.n{width:2.75rem}
.qty{display:inline-block;min-width:2rem;padding:.05rem .4rem;border-radius:var(--radius-tag);background:var(--color-paper-1);
color:var(--color-ink-700);font-size:var(--text-caption);font-weight:700;text-align:center}
.name{font-weight:600}
.var{display:block;color:var(--color-ink-500);font-size:var(--text-secondary)}
td.p{text-align:right;white-space:nowrap;padding-left:.75rem;font-weight:600}
tr.sum td{padding:.2rem 0;color:var(--color-ink-700);font-size:var(--text-button)}
tr.sum td.p{font-weight:500}
tr.first td{border-top:1px solid var(--color-paper-2);padding-top:.65rem}
.total{display:flex;align-items:baseline;justify-content:space-between;gap:.75rem;margin:.75rem 0 0;padding:.75rem 1rem;
border-radius:var(--radius-sheet);background:var(--color-paper-1)}
.total span{font-size:var(--text-secondary);font-weight:700;color:var(--color-ink-700)}
.total strong{font-size:var(--text-amount);line-height:1.1;font-weight:900;font-variant-numeric:tabular-nums}
.pay{margin:.75rem 0 0;font-size:var(--text-secondary);color:var(--color-ink-500)}
.pay b{color:var(--color-ink-900)}
.err{display:flex;gap:.6rem;align-items:flex-start;background:var(--color-danger-bg);color:var(--color-danger);
border-radius:var(--radius-control);padding:.7rem .9rem;margin:0 0 1rem;font-size:var(--text-button);font-weight:600}
.err i{flex:none;font-style:normal;width:1.25rem;height:1.25rem;border-radius:50%;background:var(--color-danger);color:#fff;
display:flex;align-items:center;justify-content:center;font-size:var(--text-caption);font-weight:900;margin-top:.1rem}
fieldset{border:0;margin:0 0 1.1rem;padding:0;min-width:0}
legend,.field>span{display:block;padding:0;margin:0 0 .5rem;font-size:var(--text-secondary);font-weight:700;color:var(--color-ink-700)}
.stars{display:flex;flex-direction:row-reverse;justify-content:space-between;gap:.4rem;position:relative}
.stars input,.tagrow input{position:absolute;opacity:0;width:1px;height:1px;margin:0}
.stars label{flex:1 1 0;max-width:3.6rem;height:3.4rem;display:flex;align-items:center;justify-content:center;cursor:pointer;
font-size:2.1rem;line-height:1;color:var(--color-gray-300);background:#fff;border:1px solid var(--color-paper-2);
border-radius:var(--radius-control);-webkit-tap-highlight-color:transparent}
.stars label i{font-style:normal}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.stars input:checked~label,.stars label:hover,.stars label:hover~label{color:var(--color-brand);background:var(--color-gold-50)}
.stars input:focus-visible+label,.tagrow input:focus-visible+label{outline:3px solid var(--color-brand-strong);outline-offset:2px}
.tags{display:flex;flex-wrap:wrap;gap:.5rem}
.tagrow{position:relative}
.tagrow label{display:inline-flex;align-items:center;gap:.35rem;min-height:2.75rem;padding:0 1rem;border-radius:var(--radius-control);
background:var(--color-paper-1);box-shadow:inset 0 0 0 1px rgba(26, 16, 8, 0.1);color:var(--color-ink-700);
font-size:var(--text-button);font-weight:600;cursor:pointer}
.tagrow input:checked+label{background:var(--color-brand-strong);box-shadow:none;color:var(--color-on-brand);font-weight:700}
.tagrow input:checked+label::before{content:"\2713"}
.field{display:block;margin:0 0 1.1rem}
textarea{display:block;width:100%;min-height:6rem;padding:.7rem .8rem;border:1px solid var(--color-paper-2);border-radius:var(--radius-control);
background:#fff;color:var(--color-ink-900);font:inherit;resize:vertical}
textarea:focus{outline:none;border-color:var(--color-brand-strong);box-shadow:0 0 0 3px rgba(143, 100, 18, 0.4)}
button,.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:3.25rem;border:0;border-radius:var(--radius-sheet);
background:var(--color-brand-strong);color:var(--color-on-brand);font:inherit;font-size:var(--text-body);font-weight:700;
cursor:pointer;text-decoration:none}
button:hover,.btn:hover{background:var(--color-brand-strong-hover)}
button:focus-visible,.btn:focus-visible{outline:3px solid var(--color-ink-900);outline-offset:2px}
.thanks{display:flex;gap:.75rem;align-items:center;margin:0 0 .9rem}
.thanks strong{font-size:17px;line-height:1.3;font-weight:900}
.check{flex:none;width:2.5rem;height:2.5rem;border-radius:50%;background:var(--color-ok-bg);color:var(--color-ok);
display:flex;align-items:center;justify-content:center;font-weight:900;font-size:1.2rem}
.static{font-size:1.9rem;line-height:1;letter-spacing:.15rem;color:var(--color-gray-300)}
.static .on{color:var(--color-brand)}
.chips{display:flex;flex-wrap:wrap;gap:.4rem;margin:.75rem 0 0;padding:0;list-style:none}
.chips li{padding:.3rem .7rem;border-radius:8px;background:var(--color-paper-1);color:var(--color-ink-700);font-size:var(--text-caption);font-weight:700}
.quote{margin:.75rem 0 0;padding:.7rem .9rem;border-radius:var(--radius-control);background:var(--color-paper-0);color:var(--color-ink-700);
white-space:pre-wrap;overflow-wrap:anywhere}
.foot{text-align:center;color:var(--color-ink-500);font-size:var(--text-secondary);margin:1.25rem 0 0}
.state{text-align:center;padding:2rem 1.25rem 1.5rem;margin-top:9vh}
.state .logo{margin-bottom:1rem}
.badge{width:3rem;height:3rem;margin:0 auto 1rem;border-radius:50%;display:flex;align-items:center;justify-content:center;
font-size:1.35rem;font-weight:900;background:var(--color-warn-bg);color:var(--color-warn-strong)}
.state h1{margin:0 0 .5rem;font-size:var(--text-bar);line-height:1.25;font-weight:900}
.state p{margin:0 0 1.25rem;color:var(--color-ink-700)}
.state p:last-child{margin-bottom:0}
@media (max-width:340px){.stars label{height:3rem;font-size:1.8rem}}
@media (prefers-reduced-motion:no-preference){button,.btn,.tagrow label,.stars label{transition:background-color .16s,color .16s}}
</style>{{end}}
