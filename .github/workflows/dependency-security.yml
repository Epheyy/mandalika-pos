name: dependency-security

on:
  # Push only on the branches that matter: PR pushes are covered by pull_request (no double runs).
  # require-green-ci.sh and the merge gates read PUSH runs, so prod-hardening and gate/<name> keep them.
  # Docs-only PRs skip (no branch protection exists to require these checks); push runs never skip.
  push:
    branches: [prod-hardening, 'gate/**']
  pull_request:
    paths-ignore: ['**/*.md']
  workflow_call:

permissions:
  contents: read

concurrency:
  # PR pushes cancel the superseded run; push/gate/workflow_call runs never cancel and never queue behind each other.
  # Literal workflow name (not github.workflow) so reusable-workflow calls from android-release.yml cannot share a group.
  group: dependency-security-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dependency-security:
    # Trusted runs (push on prod-hardening/gate/**, workflow_call) use CI_RUNS_ON. Untrusted PR code uses CI_RUNS_ON_PR,
    # which defaults to GitHub-hosted and must never name the trusted pool (see scripts/ci/README.md).
    runs-on: ${{ github.event_name == 'pull_request' && fromJSON(vars.CI_RUNS_ON_PR || '"ubuntu-latest"') || fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
          check-latest: false
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify reviewed local vendor bytes before installation
        run: python scripts/ci/dependency_vendor.py
      - name: Install pinned parsers without package lifecycle execution
        run: |
          corepack enable
          corepack prepare pnpm@9.15.0 --activate
          corepack pnpm install --frozen-lockfile --ignore-scripts
      - name: Install pinned official Go scanners
        env:
          GOTOOLCHAIN: go1.26.10
          GOENV: 'off'
          GOPROXY: https://proxy.golang.org
          GOSUMDB: sum.golang.org
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          go install github.com/google/licenseclassifier/v2/tools/identify_license@v2.0.0
      - name: Prove fail-closed policy in disposable copies
        run: |
          python scripts/ci/dependency_go_targets_test.py
          python scripts/ci/dependency_security_test.py
          python scripts/ci/dependency_vendor_test.py
          python scripts/ci/dependency_applicability_test.py
      - name: Full dependency baseline and PR delta
        env:
          SOURCE_SHA: ${{ github.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          args=()
          if [ -n "$PR_BASE_SHA" ]; then args+=(--delta-base "$PR_BASE_SHA"); fi
          python scripts/ci/dependency_security.py scan --sha "$SOURCE_SHA" --output artifacts/dependency-security "${args[@]}"
      # Runner only publishes after the artifact guard succeeds for every document.
      # No raw stderr, environment, caches, source, auth or provider/signing data.
      - name: Upload guarded public dependency evidence
        if: ${{ always() && hashFiles('artifacts/dependency-security/manifest.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: dependency-security-${{ github.sha }}
          path: artifacts/dependency-security/*.json
          retention-days: 14
          if-no-files-found: error
