name: Mandatory PostgreSQL integration

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
          check-latest: false
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: go mod download
        working-directory: backend
      - name: Runner fail-closed contracts
        run: python3 -m unittest discover -s scripts/ci -p 'test_*.py' -v
      - name: Keep fixture ports out of the kernel's ephemeral pool
        run: |
          cat /proc/sys/net/ipv4/ip_local_port_range
          sudo sysctl -w net.ipv4.ip_local_reserved_ports=26439-26479
      - name: Forty-one mandatory fresh PostgreSQL 18.3 fixtures (race enabled)
        run: python3 scripts/ci/postgres_gate.py --output artifacts/postgres/result.json
      - name: Sanitized fixture lifecycle and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postgres-gate-${{ github.sha }}
          path: artifacts/postgres/
          if-no-files-found: warn
          retention-days: 14
