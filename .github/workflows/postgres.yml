name: Mandatory PostgreSQL integration

on:
  # Push only on the branches that matter: PR pushes are covered by pull_request (no double runs).
  # require-green-ci.sh and the merge gates read PUSH runs, so prod-hardening and gate/<name> keep them.
  # Docs-only PRs skip (no branch protection exists to require these checks); push runs never skip.
  push:
    branches: [prod-hardening, 'gate/**']
  pull_request:
    paths-ignore: ['**/*.md']
  workflow_call:

permissions:
  contents: read

concurrency:
  # PR pushes cancel the superseded run; push/gate/workflow_call runs never cancel and never queue behind each other.
  # Literal workflow name (not github.workflow) so reusable-workflow calls from android-release.yml cannot share a group.
  group: postgres-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  postgres:
    # Trusted runs (push on prod-hardening/gate/**, workflow_call) use CI_RUNS_ON. Untrusted PR code uses CI_RUNS_ON_PR,
    # which defaults to GitHub-hosted and must never name the trusted pool (see scripts/ci/README.md).
    runs-on: ${{ github.event_name == 'pull_request' && fromJSON(vars.CI_RUNS_ON_PR || '"ubuntu-latest"') || fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 120  # includes time queued on the host-wide fixture lock
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
          check-latest: false
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: go mod download
        working-directory: backend
      - name: Runner fail-closed contracts
        run: python3 -m unittest discover -s scripts/ci -p 'test_*.py' -v
      - name: Keep fixture ports out of the kernel's ephemeral pool
        run: |
          cat /proc/sys/net/ipv4/ip_local_port_range
          # GitHub-hosted: sudo is passwordless. Self-hosted runners have no sudo; scripts/ci/runner-provision.sh
          # sets the same reservation at boot, so a refused sudo is fine there.
          if [ "$RUNNER_ENVIRONMENT" = github-hosted ]; then
            sudo sysctl -w net.ipv4.ip_local_reserved_ports=26439-26479
          else
            grep -q 26439-26479 /proc/sys/net/ipv4/ip_local_reserved_ports
          fi
      - name: Forty-one mandatory fresh PostgreSQL 18.3 fixtures (race enabled)
        # Fixture ports 26439-26479 are host-global and the gate is CPU-heavy: one host-wide flock serialises it with the other
        # heavy gates across every runner process on the self-hosted VM (both repos). No contention on GitHub-hosted runners.
        # Under the lock, first remove fixture containers left by a hard-killed earlier run.
        run: flock /tmp/mandalika-ci-heavy.lock sh -c 'docker ps -aq --filter label=mandalika-ci | xargs -r docker rm -f; python3 scripts/ci/postgres_gate.py --output artifacts/postgres/result.json'
      - name: Sanitized fixture lifecycle and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postgres-gate-${{ github.sha }}
          path: artifacts/postgres/
          if-no-files-found: warn
          retention-days: 14
