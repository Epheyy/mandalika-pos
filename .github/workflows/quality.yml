name: JS/TS Quality

# No path/branch filters: app/package/lockfile/schema/workflow changes all run.
on:
  # Push only on the branches that matter: PR pushes are covered by pull_request (no double runs).
  # require-green-ci.sh and the merge gates read PUSH runs, so prod-hardening and gate/<name> keep them.
  # Docs-only PRs skip (no branch protection exists to require these checks); push runs never skip.
  push:
    branches: [prod-hardening, 'gate/**']
  pull_request:
    paths-ignore: ['**/*.md']
  workflow_call:

permissions:
  contents: read

concurrency:
  # PR pushes cancel the superseded run; push/gate/workflow_call runs never cancel and never queue behind each other.
  # Literal workflow name (not github.workflow) so reusable-workflow calls from android-release.yml cannot share a group.
  group: quality-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Secret scan (tracked files) and its unit tests
        run: |
          python3 scripts/ci/secret_scan.py
          python3 -m unittest discover -s scripts/ci -p test_secret_scan.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable repository pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.0 --activate
      - name: Frozen install, tests, source/test types, builds and API drift
        run: corepack pnpm quality:ci
      - name: Restore-script DSN label test (fake DSNs only)
        run: bash scripts/dsn-label.test.sh
      # React Doctor is a separate advisory workflow, not this blocking gate.
