name: backend

on:
  workflow_call:
  # Every pushed correction needs this baseline on the same SHA as the other gates.
  push:
  pull_request:
    paths: ['backend/**', '.github/workflows/backend.yml']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.9'
          cache-dependency-path: backend/go.sum
      - run: go mod download
      - name: OpenAPI drift gate
        run: make gen-check
      - run: go vet ./...
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - run: go build ./...
      - name: Required validated codegen and contract gate
        run: python3 ../scripts/ci/codegen_gate.py
      - name: Bounded offline x/mod consumer regressions
        run: python3 ../scripts/ci/xmod-consumer-test.py
      - run: go test ./... -race
