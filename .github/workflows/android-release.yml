name: Android Release APK

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: "VITE_API_URL the APK points at"
        required: true
        default: "https://mandalika-pos-538849926142.asia-southeast2.run.app"
      release_type:
        description: "test = keeps debug settings (polishing builds); production = fails on any debug setting"
        type: choice
        options: [test, production]
        default: test
        required: true

permissions:
  contents: read

jobs:
  quality:
    uses: ./.github/workflows/quality.yml

  database:
    uses: ./.github/workflows/postgres.yml

  backend:
    uses: ./.github/workflows/backend.yml

  browser:
    uses: ./.github/workflows/browser.yml

  build:
    needs: [quality, database, backend, browser]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Release debug gate (production only)
        if: inputs.release_type == 'production'
        run: node scripts/ci/release_debug_gate_cli.mjs

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.0 --activate

      - name: Install deps
        run: corepack pnpm install --frozen-lockfile

      - name: Build POS web bundle
        env:
          VITE_API_URL: ${{ github.event.inputs.api_url }}
        run: corepack pnpm --filter @mandalika/pos build

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action's default list includes the legacy "tools" package, which
          # Google removed from the SDK repository (sdkmanager now fails on it).
          # The next step installs everything the build needs.
          packages: platform-tools

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Capacitor sync (android)
        env:
          VITE_API_URL: ${{ github.event.inputs.api_url }}
        run: corepack pnpm --filter @mandalika/pos exec cap sync android

      - name: Decode keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$GITHUB_WORKSPACE/apps/pos/android/mandalika-release.jks"

      - name: Assemble signed release
        working-directory: apps/pos/android
        env:
          ANDROID_KEYSTORE_FILE: ${{ github.workspace }}/apps/pos/android/mandalika-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Verify signature
        run: |
          APK=apps/pos/android/app/build/outputs/apk/release/app-release.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/36.0.0)
          "$BT/apksigner" verify --print-certs "$APK"

      - name: Release manifest
        id: manifest
        env:
          RELEASE_TYPE: ${{ inputs.release_type }}
          API_URL: ${{ github.event.inputs.api_url }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          OUT=apps/pos/android/app/build/outputs/apk/release
          GRADLE=apps/pos/android/app/build.gradle
          SHA=$(sha256sum "$OUT/app-release.apk" | cut -d' ' -f1)
          VCODE=$(sed -n 's/^[[:space:]]*versionCode[[:space:]]\+\([0-9]\+\).*/\1/p' "$GRADLE" | head -1)
          VNAME=$(sed -n 's/^[[:space:]]*versionName[[:space:]]\+"\([^"]*\)".*/\1/p' "$GRADLE" | head -1)
          if [ -z "$VCODE" ] || [ -z "$VNAME" ]; then
            echo "::error::could not read versionCode/versionName from $GRADLE"
            exit 1
          fi
          BUILT_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          jq -n \
            --arg commit "${{ github.sha }}" \
            --arg ref "$REF_NAME" \
            --arg run_id "${{ github.run_id }}" \
            --arg release_type "$RELEASE_TYPE" \
            --arg api_url "$API_URL" \
            --arg version_name "$VNAME" \
            --argjson version_code "$VCODE" \
            --arg apk_sha256 "$SHA" \
            --arg built_at "$BUILT_AT" \
            '{commit:$commit, ref:$ref, run_id:$run_id, release_type:$release_type, api_url:$api_url, version_name:$version_name, version_code:$version_code, apk_sha256:$apk_sha256, built_at:$built_at}' \
            > "$OUT/release-manifest.json"
          cat "$OUT/release-manifest.json"
          if [ "$RELEASE_TYPE" = "production" ]; then
            RT="production (debug gate passed)"
          else
            RT="test (debug settings allowed)"
          fi
          {
            echo "### Android release"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| release_type | $RT |"
            echo "| commit | \`${{ github.sha }}\` |"
            echo "| ref | $REF_NAME |"
            echo "| run_id | ${{ github.run_id }} |"
            echo "| api_url | $API_URL |"
            echo "| versionName | $VNAME |"
            echo "| versionCode | $VCODE |"
            echo "| APK SHA-256 | \`$SHA\` |"
            echo "| built_at | $BUILT_AT |"
          } >> "$GITHUB_STEP_SUMMARY"
          {
            echo "version_name=$VNAME"
            echo "version_code=$VCODE"
            echo "sha7=${GITHUB_SHA::7}"
          } >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mandalika-pos-${{ steps.manifest.outputs.version_name }}-build${{ steps.manifest.outputs.version_code }}-${{ inputs.release_type }}-${{ steps.manifest.outputs.sha7 }}
          path: |
            apps/pos/android/app/build/outputs/apk/release/app-release.apk
            apps/pos/android/app/build/outputs/apk/release/release-manifest.json
          if-no-files-found: error
